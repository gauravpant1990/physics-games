<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot the Forces on the Child</title>
<style>
  :root{--navy:#1b2348;--gold:#ffcf33;--green:#2fa84f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f2efe9;font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:min(94vw,360px)}
  .head{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .sub{font-size:11px;color:#5a6080;margin-bottom:7px;line-height:1.4;font-weight:500}
  .intro{margin-bottom:7px}.intro .head{margin-bottom:4px}.intro .sub{margin-bottom:0}
  .card{background:#fff;border-radius:12px;border:2px solid var(--navy);overflow:hidden;margin-bottom:7px}
  .card.pad{padding:10px 11px}
  canvas{display:block;width:100%;height:auto}
  .cap{font-size:11px;font-weight:500;color:var(--navy);line-height:1.35;padding:7px 12px;min-height:30px}
  .cap b{font-weight:700}
  .seg-lbl{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
  .badge{background:var(--navy);color:var(--gold);border-radius:20px;padding:3px 10px;font-size:11px;letter-spacing:0}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:8px;border:2px solid var(--navy);
    background:#fff;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--navy);transition:all .14s;text-align:left;font-family:inherit}
  .chip .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
  .chip:hover{background:#f2efe9}
  .chip.ok{border-color:#1D9E75;background:#eef7f1;color:#0b5740;cursor:default}
  .chip.ok::after{content:'\2713';margin-left:auto;color:#1D9E75;font-weight:800}
  .chip.bad{border-color:#E24B4A;background:#fdeeee;color:#a33;cursor:default}
  .chip.bad::after{content:'\2717';margin-left:auto;color:#E24B4A;font-weight:800}
  .row{margin-top:7px}
  .btn{width:100%;padding:9px;border-radius:8px;border:2px solid var(--navy);font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;background:var(--green);color:#fff;box-shadow:0 3px 0 #1d7a37}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1d7a37}
  footer{margin-top:8px;text-align:center;font-size:10px;color:#888780;padding-top:7px;border-top:.5px solid rgba(0,0,0,.12)}
</style></head>
<body>
<div class="wrap">
  <div class="card pad intro">
    <div class="head">Spot the forces on the child</div>
    <div class="sub">The child sits on the tilted plank, leaning against the wall. Tap every force that acts on the child. Some don't belong!</div>
  </div>
  <div class="card"><canvas id="scene"></canvas>
    <div class="cap" id="cap">Tap a force you think acts on the child.</div></div>
  <div class="card pad">
    <div class="seg-lbl"><span>Which forces act on the child?</span><span class="badge" id="badge">0 / 3</span></div>
    <div class="chips" id="chips"></div>
    <div class="row"><button class="btn" id="reset">&#8635; New round</button></div>
  </div>
  <footer>Newton's Laws &middot; Forces on a body</footer>
</div>

  if(IMG.complete&&IMG.naturalWidth) sx.drawImage(IMG,0,0,W,H); else {sx.fillStyle='#f3ecd9';sx.fillRect(0,0,W,H);}
  const ox=CX*W, oy=CY*H, L=W*0.18;
  if(done){sx.save();sx.strokeStyle='rgba(45,168,79,.95)';sx.lineWidth=3;sx.setLineDash([6,5]);sx.beginPath();sx.arc(ox,oy,L*0.62,0,7);sx.stroke();sx.setLineDash([]);sx.restore();}
  CORRECT.forEach(k=>{if(!found.has(k))return;const d=F[k].dir,p=(animKey===k)?ap:1;
    arrow(ox,oy,d[0]*L*p,d[1]*L*p,F[k].c,5.5,1);
    const lx=ox+d[0]*(L+16),ly=oy+d[1]*(L+16),al=d[0]>0.25?'left':d[0]<-0.25?'right':'center';
    tag(F[k].sym,lx,ly,F[k].c,al);});
}
function loop(){if(ap<1){ap+=0.12;if(ap>1)ap=1;}drawScene();requestAnimationFrame(loop);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderChips(){const box=document.getElementById('chips');box.innerHTML='';
  order.forEach(k=>{const b=document.createElement('button');b.className='chip'+(found.has(k)?' ok':'')+(wrong.has(k)?' bad':'');
    b.dataset.f=k;b.style.setProperty('--c',F[k].c);b.innerHTML='<span class="dot"></span>'+F[k].name;box.appendChild(b);});}
function refresh(){badge.textContent=found.size+' / 3';renderChips();}
function newRound(){order=shuffle(ALL.slice());found=new Set();wrong=new Set();animKey=null;ap=1;done=false;
  cap.innerHTML='Tap a force you think acts on the child.';refresh();}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.f;
  if(found.has(k)||wrong.has(k)||done)return;
  if(F[k].correct){found.add(k);animKey=k;ap=0;
    if(found.size>=3){done=true;cap.innerHTML='<b>Done!</b> Forces on the child: W, N and N\u2092.';}
    else cap.innerHTML='<b>\u2713 Yes.</b> '+F[k].sym+': '+F[k].why;
  }else{wrong.add(k);cap.innerHTML='<b>\u2717 Not on the child.</b> '+F[k].why;}
  refresh();});
document.getElementById('reset').addEventListener('click',newRound);
window.addEventListener('resize',()=>{fit();drawScene();});
IMG.onload=()=>drawScene();
fit();newRound();requestAnimationFrame(loop);
</script></body></html>
