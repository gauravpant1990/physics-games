<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chain Hanging Over the Edge</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}*{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}.card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}.card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}.sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}.ctl{display:flex;align-items:center;gap:10px}.ctl label{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:22px}.val{font-size:12.5px;font-weight:800;color:#185FA5;min-width:44px;text-align:right}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body><div class="wrap">
  <div class="card pad"><div class="head">Chain Hanging Over the Edge</div>
    <div class="sub">The hanging part pulls the chain down; the part on the table grips it with friction. Let too much hang over and friction can no longer hold, so the chain slides off.</div></div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad"><div class="ctl"><label>hanging part</label><input type="range" id="f" min="0" max="60" step="1" value="20"><span class="val" id="fv">20%</span></div></div>
  <div class="foot">Laws of Motion &middot; Friction &middot; max hang = &mu;L / (1 + &mu;)</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');const fE=document.getElementById('f'),fv=document.getElementById('fv');
let W=360,H=480;const ASPECT=1.3333,MU=0.5;const THR=MU/(1+MU); // 0.333
let frac=0.20,slip=0,last=0;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}draw();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';sx.textBaseline='middle';var _p=6,_w=(sx.measureText(t).width)||0,_a=al||'center',_x0,_x1;if(_a==='left'){_x0=x;_x1=x+_w;}else if(_a==='right'){_x0=x-_w;_x1=x;}else{_x0=x-_w/2;_x1=x+_w/2;}if(_x0<_p)x+=_p-_x0;if(_x1>W-_p)x-=_x1-(W-_p);var _s=(sz||11);if(y<_p+_s)y=_p+_s;if(y>H-_p-_s)y=H-_p-_s;sx.lineWidth=3.2;sx.strokeStyle='rgba(255,255,255,.9)';sx.lineJoin='round';sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}
function beads(x0,y0,x1,y1,n,col){sx.strokeStyle=col;sx.lineWidth=5;sx.lineCap='round';sx.beginPath();sx.moveTo(x0,y0);sx.lineTo(x1,y1);sx.stroke();
  sx.fillStyle='#fff';for(let i=1;i<n;i++){const t=i/n;sx.beginPath();sx.arc(x0+(x1-x0)*t,y0+(y1-y0)*t,1.6,0,7);sx.fill();}}
function draw(){sx.clearRect(0,0,W,H);
  const over=frac>THR+0.001;
  const ty=H*0.36,edge=W*0.70,left=W*0.08;
  sx.fillStyle='#e7e0d1';sx.fillRect(0,ty,edge,H*0.05);sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.beginPath();sx.moveTo(0,ty);sx.lineTo(edge,ty);sx.stroke();sx.beginPath();sx.moveTo(edge,ty);sx.lineTo(edge,ty+H*0.05);sx.stroke();
  const tableSpan=edge-left, tableLen0=tableSpan*(1-frac), hangLen0=(H*0.40)*(frac/0.6);
  const so=slip;                                   // how far the chain has slid off (px)
  const tableLen=Math.max(0,tableLen0-so);         // table part shrinks
  const drop=Math.max(0,so-tableLen0);             // once table is empty, strand falls
  const hangLen=hangLen0+Math.min(so,tableLen0);   // hanging part grows as it feeds over
  const topY=ty+drop, startX=edge-tableLen;
  if(tableLen>2){beads(startX,ty,edge,ty,Math.max(3,Math.round(tableLen/(W*0.028))),'#bb8047');
    tag('on table',(startX+edge)/2,ty-H*0.03,'#8a6f3c','center',10,800);}
  beads(edge,topY,edge,topY+hangLen,Math.max(3,Math.round(hangLen/(H*0.028))),'#bb8047');
  if(topY<H*0.90)tag('hanging',edge+W*0.05,topY+Math.min(hangLen,H*0.26)*0.5,'#8a6f3c','left',10,800);
  tag(over?'too much hangs over, chain slides off':'friction holds the chain',W*0.5,H*0.09,over?'#c0392b':'#1d7a37','center',14,800);
  // bars: hanging pull vs max friction
  const bx=W*0.22,bw=W*0.62,y1=H*0.66,mx=1.0,X=v=>bw*Math.min(v,mx)/mx;
  const pull=frac, fmax=MU*(1-frac);
  tag('hanging pull',bx-W*0.02,y1+H*0.012,'#bb8047','right',9.5,800);sx.fillStyle='#d8bd8f';sx.fillRect(bx,y1,X(pull),H*0.022);
  tag('max friction',bx-W*0.02,y1+H*0.062,'#1D9E75','right',9.5,800);sx.fillStyle='#1D9E75';sx.fillRect(bx,y1+H*0.05,X(fmax),H*0.022);
  tag('slips once hanging weight beats friction',W*0.5,H*0.80,'#1b2348','center',11,800);
  tag('here the limit is '+Math.round(THR*100)+'% hanging',W*0.5,H*0.86,'#8a8f80','center',10.5,700);
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(frac>THR+0.001){slip+=W*0.6*dt;if(slip>W*2.0)slip=W*2.0;}else slip=0;
  draw();requestAnimationFrame(loop);}
fE.addEventListener('input',()=>{frac=(+fE.value)/100;fv.textContent=fE.value+'%';if(frac<=THR+0.001)slip=0;});
window.addEventListener('resize',fit);fit();requestAnimationFrame(loop);
</script></body></html>
