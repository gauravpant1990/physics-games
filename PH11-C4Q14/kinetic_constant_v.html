<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Keeping It at Constant Speed</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}*{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}.card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}.card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}.sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}.ctl{display:flex;align-items:center;gap:10px}.ctl label{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:22px}.val{font-size:12.5px;font-weight:800;color:#185FA5;min-width:44px;text-align:right}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body><div class="wrap">
  <div class="card pad"><div class="head">Keeping It at Constant Speed</div>
    <div class="sub">Once the tank slides, kinetic friction stays fixed at 30 N whatever the speed. So it glides steadily only when your push equals 30 N.</div></div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad"><div class="ctl"><label>your push</label><input type="range" id="p" min="0" max="60" step="1" value="30"><span class="val" id="pv">30 N</span></div></div>
  <div class="foot">Laws of Motion &middot; Friction &middot; kinetic f&#x2096; = 30 N is constant</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');const pE=document.getElementById('p'),pv=document.getElementById('pv');
let W=360,H=480;const ASPECT=1.3333,FK=30,FMAX=50;let P=30,v=1.5,scroll=0,last=0;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(12,L*0.5);sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}
function draw(){sx.clearRect(0,0,W,H);
  const moving=v>0.02, fric=moving?FK:Math.min(P,FMAX), net=moving?(P-FK):(P-fric);
  const groundY=H*0.46;
  sx.strokeStyle='#1b2348';sx.lineWidth=2.5;sx.beginPath();sx.moveTo(0,groundY);sx.lineTo(W,groundY);sx.stroke();
  const sp=W*0.1,off=((scroll%sp)+sp)%sp;
  for(let x=-sp+off;x<W+sp;x+=sp){sx.strokeStyle='#cdbfa3';sx.lineWidth=1.4;sx.beginPath();sx.moveTo(x,groundY);sx.lineTo(x-W*0.02,groundY+H*0.02);sx.stroke();}
  const bw=W*0.22,bh=W*0.15,bx=W*0.48,by=groundY-bh;
  sx.fillStyle=moving?'#185FA5':'#6f7a90';sx.fillRect(bx-bw/2,by,bw,bh);sx.lineWidth=2;sx.strokeStyle='#0f3f70';sx.strokeRect(bx-bw/2,by,bw,bh);
  const sc=W*0.0038;
  arrow(bx+bw/2,by+bh*0.35,P*sc,0,'#185FA5',4.6);tag('push '+P,bx+bw/2+P*sc+W*0.03,by+bh*0.35,'#185FA5','left',10,800);
  if(fric>0.5){arrow(bx-bw/2,by+bh*0.65,-fric*sc,0,'#8a8f80',4.6);tag('friction '+Math.round(fric),bx-bw/2-fric*sc-W*0.03,by+bh*0.65,'#8a8f80','right',10,800);}
  if(Math.abs(net)>1){arrow(bx,by-H*0.03,net*sc,0,'#E24B4A',5);tag('net '+(net>0?'+':'')+Math.round(net),bx+net*sc*0.5+(net>0?W*0.02:-W*0.02),by-H*0.06,'#c0392b','center',10.5,800);}
  const verd=!moving?(P>FMAX?'about to move':'at rest'):(net>1?'speeding up':(net<-1?'slowing down':'constant speed'));
  const good=(moving&&Math.abs(net)<=1)||(!moving&&P<=FMAX);
  tag(verd,W*0.5,H*0.075,good?'#1d7a37':'#c0653a','center',16,800);
  tag(!moving?'stopped: friction only matches your push, no motion'
      :(net>1?'push beats friction, it accelerates':(net<-1?'friction beats push, it slows':'push equals friction, steady glide')),
      W*0.5,H*0.66,'#1b2348','center',12,800);
  tag(moving?'kinetic friction stays 30 N at any speed':'push over 50 N to start it sliding',W*0.5,H*0.73,'#8a8f80','center',10.5,700);
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;const moving=v>0.02;
  if(moving){v+=(P-FK)*0.018*dt;if(v<0)v=0;}else{if(P>FMAX)v=0.4;}
  v=Math.max(0,Math.min(v,5));scroll-=v;draw();requestAnimationFrame(loop);}
pE.addEventListener('input',()=>{P=+pE.value;pv.textContent=P+' N';});
window.addEventListener('resize',fit);fit();requestAnimationFrame(loop);
</script></body></html>
