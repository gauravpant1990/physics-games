<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hit the Target</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;--gold:#ffcf33;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .msg{text-align:center;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:7px;min-height:16px}
  .msg.ok{color:#1d7a37}.msg.no{color:#c0392b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
  .opt{font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 0;border-radius:9px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  .opt.on{background:#185FA5;color:#fff;border-color:#0f3f70}
  .fbtn{width:100%;font-family:inherit;font-size:13px;font-weight:800;padding:10px 0;border-radius:9px;border:2px solid var(--navy);background:#2fa84f;color:#fff;border-color:#1d7a37;cursor:pointer}
  .fbtn.reset{background:#fff;color:var(--navy)}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Hit the Target</div>
    <div class="sub">The target sits at 40 m. Pick the launch with the right speed and angle to land on it, then press Play.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="msg" id="msg">Choose a launch, then press Play</div>
    <div class="grid" id="grid"></div>
    <button class="fbtn" id="play">Play</button>
  </div>
  <div class="foot">Motion in a Plane &middot; Projectile Range &middot; R = u&#178; sin2&#952; / g</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const play=document.getElementById('play'), grid=document.getElementById('grid'), msg=document.getElementById('msg');
let W=360,H=414;const ASPECT=0.58, g=10, TARGET=40, TOL=1.8;
const OPTS=[{u:20,th:45},{u:20,th:30},{u:24,th:37},{u:16,th:45}];
const rad=d=>d*Math.PI/180;
function range(o){return o.u*o.u*Math.sin(rad(2*o.th))/g;}
function tof(o){return 2*o.u*Math.sin(rad(o.th))/g;}
let sel=-1, t=0, last=0, running=false, finished=false, result=null, parts=[];

OPTS.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.dataset.i=i;
  b.textContent='u = '+o.u+' \u00b7 '+o.th+'\u00b0';grid.appendChild(b);});

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}

function tag(t2,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.2;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t2,x,y);sx.fillStyle=col;sx.fillText(t2,x,y);}

const Xmax=Math.max(...OPTS.map(range),TARGET)*1.12;
const Ymax=Math.max(...OPTS.map(o=>Math.pow(o.u*Math.sin(rad(o.th)),2)/(2*g)))*1.25;
function geo(){const lx=W*0.09, groundY=H*0.62, fieldH=groundY-H*0.10, fieldW=W*0.88;
  const PXM=Math.min(fieldW/Xmax, fieldH/Ymax);return {lx,groundY,PXM};}

function draw(){sx.clearRect(0,0,W,H);const {lx,groundY,PXM}=geo();
  const X=x=>lx+x*PXM, Y=y=>groundY-y*PXM;
  sx.fillStyle='#eef3f6';sx.fillRect(0,0,W,groundY);
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,groundY);sx.lineTo(W,groundY);sx.stroke();
  // distance ticks every 10 m
  sx.strokeStyle='#cdc6b6';sx.lineWidth=2;sx.fillStyle='#9aa0ac';
  for(let d=10;d<Xmax;d+=10){const px=X(d);sx.beginPath();sx.moveTo(px,groundY+2);sx.lineTo(px,groundY+H*0.014);sx.stroke();
    tag(d+'',px,groundY+H*0.035,'#9aa0ac','center',8.5,700);}
  // launcher
  sx.fillStyle='#1b2348';sx.fillRect(lx-W*0.02,groundY-H*0.02,W*0.04,H*0.02);
  // target pad + flag
  const tx=X(TARGET);
  sx.fillStyle='#1D9E75';sx.beginPath();sx.ellipse(tx,groundY-2,W*0.035,H*0.012,0,0,7);sx.fill();
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(tx,groundY-2);sx.lineTo(tx,groundY-H*0.075);sx.stroke();
  sx.fillStyle='#E24B4A';sx.beginPath();sx.moveTo(tx,groundY-H*0.075);sx.lineTo(tx+W*0.05,groundY-H*0.06);sx.lineTo(tx,groundY-H*0.046);sx.closePath();sx.fill();
  tag('target 40 m',tx,groundY-H*0.092,'#1b2348','center',9.5,800);
  // chosen trajectory
  if(sel>=0){const o=OPTS[sel],Tt=tof(o),tc=Math.min(t,Tt);
    sx.strokeStyle=result==='miss'?'#d98a8a':'#185FA5';sx.lineWidth=2.6;sx.setLineDash(running||finished?[]:[5,5]);sx.beginPath();
    const tEnd=(running||finished)?tc:Tt;
    for(let tt=0;tt<=tEnd+1e-6;tt+=Tt/80){const xx=o.u*Math.cos(rad(o.th))*tt, yy=o.u*Math.sin(rad(o.th))*tt-0.5*g*tt*tt;
      tt===0?sx.moveTo(X(xx),Y(Math.max(0,yy))):sx.lineTo(X(xx),Y(Math.max(0,yy)));}
    sx.stroke();sx.setLineDash([]);
    if(running||finished){const xx=o.u*Math.cos(rad(o.th))*tc, yy=Math.max(0,o.u*Math.sin(rad(o.th))*tc-0.5*g*tc*tc);
      sx.beginPath();sx.arc(X(xx),Y(yy),W*0.02,0,7);sx.fillStyle='#E0892A';sx.fill();sx.lineWidth=2;sx.strokeStyle='#9c5e16';sx.stroke();}}
  // particles (celebration)
  parts.forEach(p=>{sx.globalAlpha=Math.max(0,p.life);sx.fillStyle=p.col;sx.beginPath();sx.arc(p.x,p.y,p.r,0,7);sx.fill();sx.globalAlpha=1;});
  // result banner
  if(finished){const ok=result==='hit';
    tag(ok?'On target!':'Missed',W*0.5,H*0.13,ok?'#1d7a37':'#c0392b','center',16,800);}
}

function spawn(x,y){parts=[];for(let i=0;i<26;i++){const a=Math.random()*7,s=W*(0.004+Math.random()*0.012);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-W*0.006,r:W*(0.006+Math.random()*0.006),life:1,col:['#1D9E75','#ffcf33','#2fa84f'][i%3]});}}
function setMsg(){if(finished){const o=OPTS[sel],r=range(o),d=r-TARGET;
    if(result==='hit'){msg.textContent='On target, nice. R = u\u00b2 sin2\u03b8 / g lands it at 40 m';msg.className='msg ok';}
    else{msg.textContent=(d>0?'Overshot by ':'Short by ')+Math.abs(d).toFixed(1)+' m. Try another launch';msg.className='msg no';}}
  else if(sel<0){msg.textContent='Choose a launch, then press Play';msg.className='msg';}
  else{msg.textContent='Ready: u = '+OPTS[sel].u+', \u03b8 = '+OPTS[sel].th+'\u00b0';msg.className='msg';}}
function updateBtn(){play.textContent=(running||finished)?'Reset':'Play';play.classList.toggle('reset',running||finished);}
function reset(){running=false;finished=false;result=null;t=0;parts=[];updateBtn();setMsg();draw();}

[...grid.children].forEach(b=>b.addEventListener('click',()=>{if(running)return; if(finished)reset();
  sel=+b.dataset.i;[...grid.children].forEach(c=>c.classList.toggle('on',c===b));setMsg();draw();}));
play.addEventListener('click',()=>{if(running||finished){reset();return;}
  if(sel<0){msg.textContent='Pick a launch first';msg.className='msg no';return;}
  running=true;t=0;result=null;updateBtn();});

function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(running){const o=OPTS[sel],Tt=tof(o);t+=dt*0.65;
    if(t>=Tt){t=Tt;running=false;finished=true;const r=range(o);
      result=Math.abs(r-TARGET)<TOL?'hit':'miss';
      if(result==='hit'){const{lx,groundY,PXM}=geo();spawn(lx+r*PXM,groundY-2);}
      updateBtn();setMsg();}}
  if(parts.length){const{groundY}=geo();parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=W*0.0006;p.life-=0.018;});parts=parts.filter(p=>p.life>0);}
  draw();requestAnimationFrame(loop);}
window.addEventListener('resize',fit);
fit();updateBtn();setMsg();requestAnimationFrame(loop);
</script></body></html>
