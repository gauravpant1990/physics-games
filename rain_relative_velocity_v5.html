<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain — Relative Velocity</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f2efe9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px 0 40px}
.wrap{width:360px;max-width:100%}
.card{background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,0.12);overflow:hidden;margin-bottom:10px}
canvas{display:block}
.ctrl-card{background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,0.12);padding:14px;margin-bottom:10px}
.cb{padding:8px 0;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.cb:first-child{padding-top:0}
.cb:last-child{border-bottom:none;padding-bottom:0}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lbl{font-size:13px;font-weight:500;color:#1a1a18;flex:1}
.val{font-size:12px;font-weight:500;font-family:monospace;flex-shrink:0;min-width:72px;text-align:right}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;outline:none;cursor:pointer;padding:0;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:30px;border-radius:15px}
input[type=range]::-moz-range-track{height:30px;border-radius:15px}
#vr::-webkit-slider-runnable-track{background:#5a8f3c}
#vr::-moz-range-track{background:#5a8f3c}
#vp::-webkit-slider-runnable-track{background:linear-gradient(to right,#185FA5 0%,#ccc 50%,#BA7517 100%)}
#vp::-moz-range-track{background:linear-gradient(to right,#185FA5 0%,#ccc 50%,#BA7517 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.28);margin-top:4px;cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.28);cursor:pointer}
.ins{background:#f5f5f3;border-radius:12px;padding:10px 13px;font-size:12px;color:#5f5e5a;line-height:1.6;border:0.5px solid rgba(0,0,0,0.1)}
.ins strong{color:#1a1a18}
footer{margin-top:24px;text-align:center;font-size:11px;color:#888780;padding-top:12px;border-top:0.5px solid rgba(0,0,0,0.1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><canvas id="sc"></canvas></div>
  <div class="card"><canvas id="vc"></canvas></div>
  <div class="ctrl-card">
    <div class="cb">
      <div class="ct">
        <div class="dot" style="background:#5a8f3c"></div>
        <div class="lbl">Rain speed (downward)</div>
        <div class="val" id="vr-val" style="color:#5a8f3c">6 m/s ↓</div>
      </div>
      <input type="range" id="vr" min="2" max="12" value="6" step="1">
    </div>
    <div class="cb">
      <div class="ct">
        <div class="dot" style="background:#BA7517"></div>
        <div class="lbl">Person's speed (← neg / pos →)</div>
        <div class="val" id="vp-val" style="color:#BA7517">0 m/s</div>
      </div>
      <input type="range" id="vp" min="-10" max="10" value="0" step="1">
    </div>
  </div>
  <div class="ins" id="ins">Move the sliders to explore how rain appears to tilt.</div>
  <footer>Relative Velocity · Rain · Made with Claude</footer>
</div>
<script>

const sctx=scEl.getContext('2d');
const vcEl=document.getElementById('vc');

  scEl.width=W; scEl.height=Math.round(W*0.56);
  vcEl.width=W; vcEl.height=Math.round(W*0.5);
  initDrops();
}

const imgs=SRCS.map(s=>{ const i=new Image(); i.src='data:image/png;base64,'+s; return i; });

function initDrops(){
  drops=[];
  const W=scEl.width, H=scEl.height;
  for(let i=0;i<60;i++) drops.push({x:Math.random()*W, y:Math.random()*H});
}

function drawScene(){
  const W=scEl.width, H=scEl.height;
  sctx.clearRect(0,0,W,H);

  /* sky gradient */
  const skyGrad=sctx.createLinearGradient(0,0,0,H*0.7);
  skyGrad.addColorStop(0,'#a8cfe8');
  skyGrad.addColorStop(1,'#cfe6f5');
  sctx.fillStyle=skyGrad;
  sctx.fillRect(0,0,W,H);

  const groundY=H-32;

  /* ---- SCROLLING BACKGROUND ----
     Person moves RIGHT (+vPerson) => background scrolls LEFT (offset increases)
     bgOffset increases when vPerson>0, so buildings shift left */
  const BW=130;

  /* Far buildings - move at 0.3x (parallax: far = slow) */
  let farOff=((bgOffset*0.3 % BW)+BW)%BW;
  for(let t=-1;t<=Math.ceil(W/BW)+1;t++){
    let tx=t*BW-farOff;
    let seed=((t%7+7)%7);
    let bh=35+seed*5;
    sctx.fillStyle='#b8ccd8';
    sctx.fillRect(tx+5,groundY-bh,60,bh);
    sctx.fillStyle='rgba(180,200,220,0.6)';
    for(let wy=groundY-bh+6;wy<groundY-4;wy+=12)
      for(let wx=tx+10;wx<tx+60;wx+=10)
        sctx.fillRect(wx,wy,6,7);
  }

  /* Near trees - move at 0.7x */
  let nearOff=((bgOffset*0.7 % BW)+BW)%BW;
  for(let t=-1;t<=Math.ceil(W/BW)+1;t++){
    let tx=t*BW-nearOff;
    sctx.fillStyle='#4a7a3a';
    sctx.beginPath();sctx.arc(tx+95,groundY-18,16,0,Math.PI*2);sctx.fill();
    sctx.fillStyle='#3a2a1a';
    sctx.fillRect(tx+92,groundY-4,6,8);
  }

  /* ground */
  sctx.fillStyle='#6a9a55'; sctx.fillRect(0,groundY,W,8);
  sctx.fillStyle='#b0ada6'; sctx.fillRect(0,groundY+8,W,16);
  sctx.fillStyle='#888'; sctx.fillRect(0,groundY+24,W,8);

  /* pavement dashes - move at 1.5x (closest layer = fastest parallax) */
  sctx.strokeStyle='rgba(255,255,255,0.5)'; sctx.lineWidth=1;
  let pOff=((bgOffset*1.5 % 40)+40)%40;
  for(let px=-40-pOff; px<W+40; px+=40){
    sctx.beginPath();sctx.moveTo(px,groundY+12);sctx.lineTo(px+20,groundY+12);sctx.stroke();
    sctx.beginPath();sctx.moveTo(px,groundY+19);sctx.lineTo(px+20,groundY+19);sctx.stroke();
  }

  /* rain drops */
  let mag=Math.sqrt(vPerson*vPerson+vRain*vRain)||1;
  /* relative velocity of rain w.r.t. person: vx=-vPerson, vy=vRain */
  let rdx=(-vPerson/mag)*15, rdy=(vRain/mag)*15;
  sctx.strokeStyle='rgba(80,140,210,0.6)'; sctx.lineWidth=1.3;
  drops.forEach(d=>{
    sctx.beginPath(); sctx.moveTo(d.x,d.y); sctx.lineTo(d.x+rdx,d.y+rdy); sctx.stroke();
  });

  /* character sprite */
  let pose=0;
  if(Math.abs(vPerson)>0){
    let interval=Math.max(3,Math.round(20/Math.abs(vPerson)));
    pose=1+(Math.floor(frameCount/interval)%3); /* cycles 1,2,3 */
  }
  let img=imgs[pose];
  let charH=Math.round(H*0.42);
  let charW=img.complete&&img.naturalWidth>0
    ? Math.round(charH*img.naturalWidth/img.naturalHeight) : Math.round(charH*0.55);
  let cy2=groundY-charH+4;
  let cx2=W/2-charW/2;
  let facingRight=vPerson>=0;

  if(img.complete&&img.naturalWidth>0){
    sctx.save();
    if(!facingRight){
      sctx.translate(W,0); sctx.scale(-1,1);
      /* mirror cx2 */
      sctx.drawImage(img, W-cx2-charW, cy2, charW, charH);
    } else {
      sctx.drawImage(img, cx2, cy2, charW, charH);
    }
    sctx.restore();
  }

  /* angle label top-left */
  let deg=(Math.atan2(Math.abs(vPerson),vRain)*180/Math.PI).toFixed(1);
  sctx.fillStyle='rgba(0,0,0,0.55)';
  sctx.font='bold 11px monospace'; sctx.textAlign='left';
  sctx.fillText('θ = '+deg+'°', 8, 18);
}

/* ---- VECTOR DIAGRAM ---- */
function arrowVec(ctx,x1,y1,x2,y2,col,lw){
  let dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<4)return;
  ctx.save();
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw||3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  let ux=dx/len,uy=dy/len,hs=10;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hs*ux+hs*0.4*(-uy), y2-hs*uy+hs*0.4*ux);
  ctx.lineTo(x2-hs*ux-hs*0.4*(-uy), y2-hs*uy-hs*0.4*ux);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawVec(){
  const VW=vcEl.width, VH=vcEl.height;
  vctx.clearRect(0,0,VW,VH);
  vctx.fillStyle='#ffffff';
  vctx.fillRect(0,0,VW,VH);

  /* Layout: left half = vector diagram, right half = table */
  const HALF=Math.round(VW*0.52);
  const OX=HALF/2, OY=VH*0.3;  /* origin in upper area of left half */
  const maxR=Math.min(HALF/2-14, VH*0.55);
  const SC=maxR/12;

  let rainY=vRain*SC;
  let persX=-vPerson*SC; /* -v_person horizontal */
  let relX=-vPerson*SC, relY=vRain*SC;

  function clamp(ex,ey){
    let dx=ex-OX,dy=ey-OY,d=Math.sqrt(dx*dx+dy*dy);
    return d>maxR?[OX+dx/d*maxR,OY+dy/d*maxR]:[ex,ey];
  }

  /* axis guides */
  vctx.strokeStyle='rgba(0,0,0,0.07)'; vctx.lineWidth=0.8; vctx.setLineDash([3,3]);
  vctx.beginPath(); vctx.moveTo(OX,8); vctx.lineTo(OX,VH-8); vctx.stroke();
  vctx.beginPath(); vctx.moveTo(8,OY); vctx.lineTo(HALF-4,OY); vctx.stroke();
  vctx.setLineDash([]);

  /* dashed triangle completion lines */
  let [ex_rain, ey_rain]=clamp(OX, OY+rainY);
  let [ex_pers, ey_pers]=clamp(OX+persX, OY);
  let [ex_rel,  ey_rel ]=clamp(OX+relX,  OY+relY);
  vctx.strokeStyle='rgba(0,0,0,0.1)'; vctx.lineWidth=1; vctx.setLineDash([3,3]);
  vctx.beginPath(); vctx.moveTo(ex_pers,ey_pers); vctx.lineTo(ex_rel,ey_rel); vctx.stroke();
  vctx.beginPath(); vctx.moveTo(ex_rain,ey_rain); vctx.lineTo(ex_rel,ey_rel); vctx.stroke();
  vctx.setLineDash([]);

  /* arrows */
  arrowVec(vctx, OX, OY, ex_rain, ey_rain, '#5a8f3c', 3);
  if(Math.abs(persX)>4) arrowVec(vctx, OX, OY, ex_pers, ey_pers, '#BA7517', 3);
  let relLen=Math.sqrt(relX*relX+relY*relY);
  if(relLen>6) arrowVec(vctx, OX, OY, ex_rel, ey_rel, '#185FA5', 3);

  /* angle arc — between downward axis and v_rel */
  if(Math.abs(vPerson)>0.3){
    /* v_rel angle from vertical (downward = +Y axis) */
    let relAngle=Math.atan2(relX, relY); /* angle from +Y toward +X if person moves right, toward -X if left */
    let arcR=26;
    vctx.strokeStyle='rgba(24,95,165,0.6)'; vctx.lineWidth=1.5;
    vctx.beginPath();
    /* arc from straight down (PI/2 in canvas = down) sweeping to relAngle */
    /* in canvas coords: +Y is down. "straight down" direction = angle PI/2 from +X */
    /* v_rel = (relX, relY). angle of v_rel from +X axis = atan2(relY, relX) */
    let vrelAngle=Math.atan2(relY,relX); /* angle of v_rel vector from +X */
    let downAngle=Math.PI/2;             /* straight down from +X */
    let aStart=Math.min(downAngle,vrelAngle);
    let aEnd=Math.max(downAngle,vrelAngle);
    /* only draw if arc is less than 180deg */
    if(aEnd-aStart < Math.PI){
      vctx.arc(OX,OY,arcR,aStart,aEnd);
    } else {
      vctx.arc(OX,OY,arcR,aEnd,aStart+Math.PI*2);
    }
    vctx.stroke();
    /* θ label midway on arc */
    let amid=(vrelAngle+downAngle)/2;
    vctx.fillStyle='#185FA5'; vctx.font='bold 11px sans-serif'; vctx.textAlign='center';
    vctx.fillText('θ', OX+(arcR+10)*Math.cos(amid), OY+(arcR+10)*Math.sin(amid)+4);
  }

  /* origin dot */
  vctx.beginPath(); vctx.arc(OX,OY,3,0,Math.PI*2);
  vctx.fillStyle='rgba(0,0,0,0.35)'; vctx.fill();

  /* ---- RIGHT SIDE TABLE ---- */
  const TX=HALF+10, TY=14, TW=VW-HALF-14;

  vctx.font='bold 10px sans-serif';

  /* divider */
  vctx.strokeStyle='rgba(0,0,0,0.08)'; vctx.lineWidth=1;
  vctx.beginPath(); vctx.moveTo(HALF,8); vctx.lineTo(HALF,VH-8); vctx.stroke();

  let relSpeed=Math.sqrt(vPerson*vPerson+vRain*vRain);
  let relAngleDeg=(Math.atan2(Math.abs(vPerson),vRain)*180/Math.PI).toFixed(1);

  const rows=[
    {col:'#5a8f3c', label:'v_rain', val:vRain.toFixed(0)+' m/s ↓'},
    {col:'#BA7517', label:'v_person', val:(vPerson>=0?'+':'')+vPerson.toFixed(0)+' m/s'},
    {col:'#185FA5', label:'v_rel', val:relSpeed.toFixed(1)+' m/s'},
    {col:'#185FA5', label:'θ', val:relAngleDeg+'°'},
  ];

  let rowH=(VH-TY-10)/rows.length;
  rows.forEach((r,i)=>{
    let ry=TY+i*rowH;
    /* coloured left bar */
    vctx.fillStyle=r.col;
    vctx.fillRect(TX,ry+4,3,rowH-8);
    /* label */
    vctx.fillStyle=r.col;
    vctx.font='bold 10px monospace';
    vctx.textAlign='left';
    vctx.fillText(r.label,TX+8,ry+rowH*0.42);
    /* value */
    vctx.fillStyle='#1a1a18';
    vctx.font='500 11px monospace';
    vctx.fillText(r.val,TX+8,ry+rowH*0.75);
    /* separator */
    if(i<rows.length-1){
      vctx.strokeStyle='rgba(0,0,0,0.06)'; vctx.lineWidth=0.5;
      vctx.beginPath(); vctx.moveTo(TX+4,ry+rowH); vctx.lineTo(VW-4,ry+rowH); vctx.stroke();
    }
  });
}

function updateDrops(dt){
  const W=scEl.width, H=scEl.height;
  let mag=Math.sqrt(vPerson*vPerson+vRain*vRain)||1;
  let vx=(-vPerson/mag)*vRain*0.7;
  let vy=(vRain/mag)*vRain*0.7;
  drops.forEach(d=>{
    d.x+=vx*dt*10; d.y+=vy*dt*10;
    if(d.y>H)  { d.y=-14; d.x=Math.random()*W; }
    if(d.x>W+14) d.x=-5;
    if(d.x<-14)  d.x=W+5;
  });
}

function updateUI(){
  let a=(Math.atan2(Math.abs(vPerson),vRain)*180/Math.PI).toFixed(1);
  let el=document.getElementById('ins');
  if(vPerson===0) el.innerHTML='Person is <strong>stationary</strong>. Rain falls straight down — θ = 0°.';
  else if(Math.abs(vPerson)<vRain*0.5) el.innerHTML='Moving slowly. Rain tilts <strong>'+a+'°</strong> from vertical.';
  else if(Math.abs(vPerson)<vRain)     el.innerHTML='Rain angle = <strong>'+a+'°</strong>. Significant forward tilt.';
  else el.innerHTML='Running fast! Rain angle = <strong>'+a+'°</strong> — nearly horizontal.';
  document.getElementById('vr-val').textContent=vRain+' m/s ↓';
  let d=vPerson>0?' →':vPerson<0?' ←':'';
  document.getElementById('vp-val').textContent=(vPerson>0?'+':'')+vPerson+' m/s'+d;
}

function loop(ts){
  let dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts; frameCount++;
  /* person walks right → scene moves left → bgOffset increases */
  bgOffset+=vPerson*dt*18;
  updateDrops(dt);
  drawScene();
  drawVec();
  requestAnimationFrame(loop);
}

document.getElementById('vr').addEventListener('input',e=>{ vRain=+e.target.value; updateUI(); });
document.getElementById('vp').addEventListener('input',e=>{ vPerson=+e.target.value; updateUI(); });
window.addEventListener('resize',()=>{ setSize(); });

setSize(); updateUI();
lastTs=performance.now();
requestAnimationFrame(loop);
</script>
</body>
