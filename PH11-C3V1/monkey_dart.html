<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Monkey and the Dart</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:380px;max-width:96vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px;margin:3px 0}
  .ctl label{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap;min-width:74px}
  input[type=range]{flex:1;accent-color:#185FA5;height:22px}
  .val{font-size:12px;font-weight:800;color:#185FA5;min-width:54px;text-align:right}
  .btn{width:100%;font-family:inherit;font-size:13px;font-weight:800;padding:9px;border-radius:9px;border:2px solid #1d7a37;background:#2fa84f;color:#fff;cursor:pointer;margin-top:4px}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">The Monkey and the Dart</div>
    <div class="sub">Aim the dart straight at the monkey. The instant you fire, the monkey lets go. Both fall by the same amount each moment, so the dart always meets it.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>horizontal speed</label><input type="range" id="v" min="14" max="40" step="1" value="22"><span class="val" id="vv">22 m/s</span></div>
    <button class="btn" id="go">Fire</button>
  </div>
  <div class="foot">Motion in a Plane &middot; Projectile &middot; both fall &frac12;gt&sup2; together</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const vE=document.getElementById('v'),vv=document.getElementById('vv'),go=document.getElementById('go');
let W=380,H=270;const ASPECT=0.71, G=10, DX=20;   // 20 m apart, same height
let v=22,mode='ready',s=0,T=1;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const dd=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*dd);scn.height=Math.round(H*dd);sx.setTransform(dd,0,0,dd,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||380,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.96,380);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(200,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(9,L*0.6);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(tx,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(tx,x,y);sx.fillStyle=col;sx.fillText(tx,x,y);}
function draw(){sx.clearRect(0,0,W,H);
  const xL=W*0.13,xR=W*0.85,topY=H*0.22,availH=H*0.62,vS=availH/(0.5*G*T*T);
  const ss=mode==='ready'?0:s, t=ss*T, drop=0.5*G*t*t, dpx=drop*vS;
  // aim line straight at monkey
  sx.strokeStyle='#b9b2a2';sx.lineWidth=1.4;sx.setLineDash([5,5]);sx.beginPath();sx.moveTo(xL,topY);sx.lineTo(xR,topY);sx.stroke();sx.setLineDash([]);
  // balconies
  sx.fillStyle='#cfc7b6';sx.fillRect(xL-W*0.05,topY+H*0.02,W*0.05,H*0.05);sx.fillRect(xR,topY+H*0.02,W*0.05,H*0.05);
  // shooter
  sx.fillStyle='#185FA5';sx.beginPath();sx.arc(xL,topY-H*0.02,H*0.02,0,7);sx.fill();
  // dart
  const dx=xL+(xR-xL)*ss, dy=topY+dpx;
  // monkey (drops straight down)
  const my=topY+dpx;
  sx.fillStyle='#7A4FA3';sx.beginPath();sx.arc(xR,my,H*0.032,0,7);sx.fill();
  sx.fillStyle='#fff';sx.beginPath();sx.arc(xR-H*0.012,my-H*0.006,H*0.007,0,7);sx.arc(xR+H*0.012,my-H*0.006,H*0.007,0,7);sx.fill();
  // dart marker
  sx.fillStyle='#E0892A';sx.save();sx.translate(dx,dy);sx.rotate(Math.atan2(dpx>0?(G*t*vS):0,(xR-xL)/T));
  sx.fillRect(-H*0.03,-H*0.006,H*0.06,H*0.012);sx.restore();
  // equal drop arrows
  if(ss>0.02){arrow(xR+W*0.05,topY,0,dpx,'#1D9E75',2.6);tag('\u00bdgt\u00b2',xR+W*0.085,topY+dpx*0.5,'#1d7a37','left',9.5,800);
    arrow(dx-W*0.04,topY,0,dpx,'#1D9E75',2.6);}
  // labels
  tag('the dart speed is purely horizontal, it is fired level at the monkey',W*0.5,H*0.06,'#1b2348','center',10,800);
  tag('shooter',xL,topY-H*0.085,'#185FA5','center',9.5,700);
  tag('monkey',xR,topY-H*0.085,'#7A4FA3','center',9.5,700);
  tag(mode==='done'?'the dart meets the monkey':'both drop the same each instant',W*0.5,H*0.94,'#5b6172','center',11.5,800);
}
function step(){if(mode==='playing'){s+=0.014;if(s>=1){s=1;mode='done';go.textContent='Reset';}draw();requestAnimationFrame(step);}}
go.addEventListener('click',()=>{if(mode==='playing')return;if(mode==='done'){mode='ready';s=0;go.textContent='Fire';draw();}
  else{mode='playing';s=0;go.textContent='...';requestAnimationFrame(step);}});
function upd(){v=+vE.value;vv.textContent=v+' m/s';T=DX/v;mode='ready';s=0;go.textContent='Fire';draw();}
vE.addEventListener('input',upd);
window.addEventListener('resize',fit);
upd();fit();
</script></body></html>
