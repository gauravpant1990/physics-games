<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Friction Holds a Range</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:24px}
  .val{font-size:13px;font-weight:800;color:#185FA5;min-width:54px;text-align:right}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Friction Holds a Range</div>
    <div class="sub">Pull a block up a 37&deg; slope. Friction quietly flips direction and adjusts itself, holding the block across a whole band of pulls. Leave the band and it slips or climbs.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>pull force</label>
      <input type="range" id="pull" min="0" max="1700" step="20" value="960">
      <span class="val" id="pullv">960 N</span></div>
  </div>
  <div class="foot">Laws of Motion &middot; Friction &middot; the equilibrium range on an incline</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const pull=document.getElementById('pull'),pullv=document.getElementById('pullv');
let W=360,H=468;const ASPECT=1.30;
const WT=1600, TH=37*Math.PI/180, ST=0.6, CT=0.8;
const Wpar=WT*ST, N=WT*CT, FMAX=0.25*N;
const LO=Wpar-FMAX, HI=Wpar+FMAX;
let P=960, off=0, last=0;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(12,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}

function state(){ if(P<LO-1) return 'down'; if(P>HI+1) return 'up'; return 'hold'; }
function friction(){ if(P<LO) return FMAX; if(P>HI) return -FMAX; return Wpar-P; }

function draw(){sx.clearRect(0,0,W,H);
  // ---- incline scene (clean: block + motion only) ----
  const ax=W*0.12, by=H*0.39, base=W*0.60, hgt=base*Math.tan(TH);
  const A={x:ax,y:by}, B={x:ax+base,y:by}, C={x:ax+base,y:by-hgt};
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,by);sx.lineTo(W,by);sx.stroke();
  sx.beginPath();sx.moveTo(A.x,A.y);sx.lineTo(B.x,B.y);sx.lineTo(C.x,C.y);sx.closePath();
  sx.fillStyle='#e9e3d6';sx.fill();sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.stroke();
  tag('37\u00b0',A.x+W*0.12,A.y-W*0.035,'#1b2348','left',12,800);
  const up={x:CT,y:-ST}, down={x:-CT,y:ST}, nrm={x:-ST,y:-CT};
  const st=state();
  const f=0.50+off, bc={x:A.x+(C.x-A.x)*f,y:A.y+(C.y-A.y)*f};
  const bw=W*0.085,bh=W*0.058,ctr={x:bc.x+nrm.x*(bh*0.5+2),y:bc.y+nrm.y*(bh*0.5+2)};
  sx.save();sx.translate(ctr.x,ctr.y);sx.rotate(-TH);
  sx.fillStyle=st==='hold'?'#185FA5':(st==='down'?'#c0653a':'#2fa84f');
  sx.fillRect(-bw/2,-bh/2,bw,bh);sx.lineWidth=2;sx.strokeStyle='#0f3f70';sx.strokeRect(-bw/2,-bh/2,bw,bh);
  sx.restore();
  if(st!=='hold'){const d=st==='down'?down:up;arrow(ctr.x+nrm.x*W*0.055,ctr.y+nrm.y*W*0.055,d.x*W*0.11,d.y*W*0.11,st==='down'?'#c0392b':'#1d7a37',4);}
  const txt=st==='hold'?'block holds':(st==='down'?'slips down':'pulled up');
  const col=st==='hold'?'#1d7a37':(st==='down'?'#c0392b':'#1d7a37');
  tag(txt,W*0.28,H*0.065,col,'center',15,800);
  // ---- steady horizontal free-body diagram ----
  sx.strokeStyle='#e4dccb';sx.lineWidth=1;sx.beginPath();sx.moveTo(W*0.08,H*0.435);sx.lineTo(W*0.92,H*0.435);sx.stroke();
  tag('the tug along the slope',W*0.5,H*0.468,'#5b6172','center',10.5,700);
  const O={x:W*0.5,y:H*0.56}, fs=0.000150*W;
  sx.strokeStyle='#cfc7b6';sx.lineWidth=1.5;sx.beginPath();sx.moveTo(W*0.11,O.y);sx.lineTo(W*0.89,O.y);sx.stroke();
  // friction first (above the axis), so labels never collide
  const fr=friction();
  if(Math.abs(fr)>4){const fy=O.y-H*0.05;arrow(O.x,fy,(fr>0?1:-1)*Math.abs(fr)*fs,0,'#8a8f80',4.4);
    tag('friction',O.x+(fr>0?1:-1)*Math.abs(fr)*fs*0.5,fy-H*0.03,'#8a8f80','center',10.5,800);}
  // block marker on the axis
  sx.fillStyle=st==='hold'?'#185FA5':(st==='down'?'#c0653a':'#2fa84f');
  sx.fillRect(O.x-W*0.024,O.y-W*0.024,W*0.048,W*0.048);sx.lineWidth=2;sx.strokeStyle='#0f3f70';sx.strokeRect(O.x-W*0.024,O.y-W*0.024,W*0.048,W*0.048);
  // pull (right) and W sin (left), labels below the axis, far apart
  arrow(O.x+W*0.026,O.y,P*fs,0,'#185FA5',4.6); tag('pull',O.x+W*0.026+P*fs+W*0.04,O.y,'#185FA5','left',11,800);
  arrow(O.x-W*0.026,O.y,-Wpar*fs,0,'#E24B4A',4.6); tag('W sin37\u00b0',O.x-W*0.026-Wpar*fs-W*0.04,O.y,'#E24B4A','right',11,800);
  // ---- pull-force band line ----
  const xL=W*0.10,xR=W*0.90,yB=H*0.715,maxP=1700, X=p=>xL+(xR-xL)*p/maxP;
  sx.lineCap='round';
  sx.strokeStyle='#c0392b';sx.lineWidth=7;sx.beginPath();sx.moveTo(xL,yB);sx.lineTo(X(LO),yB);sx.stroke();
  sx.strokeStyle='#1D9E75';sx.beginPath();sx.moveTo(X(LO),yB);sx.lineTo(X(HI),yB);sx.stroke();
  sx.strokeStyle='#E0892A';sx.beginPath();sx.moveTo(X(HI),yB);sx.lineTo(xR,yB);sx.stroke();
  [[LO,'640'],[HI,'1280']].forEach(([v,l])=>{sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(X(v),yB-H*0.017);sx.lineTo(X(v),yB+H*0.017);sx.stroke();
    tag(l,X(v),yB+H*0.035,'#1b2348','center',10,800);});
  sx.strokeStyle='#5b6172';sx.lineWidth=1.5;sx.setLineDash([3,3]);sx.beginPath();sx.moveTo(X(Wpar),yB-H*0.025);sx.lineTo(X(Wpar),yB+H*0.025);sx.stroke();sx.setLineDash([]);
  tag('960 no friction',X(Wpar),yB-H*0.038,'#5b6172','center',9.5,700);
  const px=X(P);arrow(px,yB-H*0.068,0,H*0.048,'#185FA5',4);
  tag('slips down',xL+(X(LO)-xL)/2,yB+H*0.066,'#c0392b','center',9.5,700);
  tag('holds',(X(LO)+X(HI))/2,yB+H*0.066,'#1d7a37','center',9.5,700);
  tag('pulled up',(X(HI)+xR)/2,yB+H*0.066,'#c77a1e','center',9.5,700);
  // readouts
  tag('pull = '+P+' N',W*0.5,H*0.875,'#185FA5','center',13,800);
  const fr2=friction();
  tag(Math.abs(fr2)<5?'friction = 0':('friction = '+Math.round(Math.abs(fr2))+' N '+(fr2>0?'up the slope':'down the slope')),
    W*0.5,H*0.925,'#5b6172','center',12,800);
}
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;const st=state();
  if(st==='down'){off-=0.18*dt; if(off<-0.34)off=0.30;}
  else if(st==='up'){off+=0.18*dt; if(off>0.34)off=-0.30;}
  else off+=(0-off)*Math.min(1,dt*6);
  draw();requestAnimationFrame(loop);}
pull.addEventListener('input',()=>{P=+pull.value;pullv.textContent=P+' N';});
window.addEventListener('resize',fit);
fit();requestAnimationFrame(loop);
</script></body></html>
