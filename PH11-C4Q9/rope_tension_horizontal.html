<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tension in a Pulled Rope</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;--gold:#ffcf33;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 11px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:.2px}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;flex-direction:column;gap:7px}
  .srow{display:flex;align-items:center;gap:9px}
  .slab{font-size:11.5px;font-weight:700;color:var(--navy);white-space:nowrap}
  .sval{font-size:12px;font-weight:800;color:#185FA5;min-width:54px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:#d7dae6;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#185FA5;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#185FA5;border:3px solid #fff;cursor:pointer}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Tension in a Pulled Rope</div>
    <div class="sub">A heavy rope on a frictionless floor, pulled with a fixed force. Slide to any point and read the tension there.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl">
      <div class="srow"><span class="slab">Point on rope</span>
        <input type="range" id="pt" min="0" max="1" step="0.004" value="0.5">
        <span class="sval" id="pval">middle</span></div>
    </div>
  </div>
  <div class="foot">Laws of Motion &middot; String with Mass &middot; Horizontal</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const ptEl=document.getElementById('pt'),pval=document.getElementById('pval');
let W=360,H=223;const ASPECT=0.62;
const F=12;
const marks=[0.25,1/3,0.5,2/3,0.75], mlab=['\u00BC','\u2153','\u00BD','\u2154','\u00BE'];
let f=0.5;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<2&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(180,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}

function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(9,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(tx,x,y,col,al,sz){sx.font='800 '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3;sx.strokeStyle='rgba(255,255,255,.92)';sx.lineJoin='round';
  sx.strokeText(tx,x,y);sx.fillStyle=col;sx.fillText(tx,x,y);}
function rrect(x,y,w,h,r){sx.beginPath();sx.roundRect(x,y,w,h,r);}
function ropeH(x1,x2,y,wdt){sx.lineCap='round';
  sx.strokeStyle='#7d4f25';sx.lineWidth=wdt+3;sx.beginPath();sx.moveTo(x1,y);sx.lineTo(x2,y);sx.stroke();
  sx.strokeStyle='#bb8047';sx.lineWidth=wdt;sx.beginPath();sx.moveTo(x1,y);sx.lineTo(x2,y);sx.stroke();
  sx.strokeStyle='rgba(80,45,15,.5)';sx.lineWidth=1.1;
  for(let x=x1+9;x<x2-3;x+=10){sx.beginPath();sx.moveTo(x,y-wdt/2+1);sx.lineTo(x,y+wdt/2-1);sx.stroke();}}
function bubble(cx,cy,txt){sx.font='800 15px Trebuchet MS,sans-serif';const w=sx.measureText(txt).width+20,h=25;
  rrect(cx-w/2,cy-h/2,w,h,8);sx.fillStyle='#ffcf33';sx.fill();sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.stroke();
  sx.beginPath();sx.moveTo(cx-5,cy+h/2-1);sx.lineTo(cx+5,cy+h/2-1);sx.lineTo(cx,cy+h/2+7);sx.closePath();sx.fillStyle='#ffcf33';sx.fill();sx.stroke();
  tag(txt,cx,cy,'#1b2348','center',15);}

function nearestMark(){let bi=-1,bd=1;for(let i=0;i<marks.length;i++){const d=Math.abs(f-marks[i]);if(d<bd){bd=d;bi=i;}}return bd<0.018?bi:-1;}

function draw(){sx.clearRect(0,0,W,H);
  const ry=H*0.44, xA=W*0.085, xB=W*0.80, wdt=W*0.03;
  const T=F*f;
  // rope + force + free end
  ropeH(xA,xB,ry,wdt);
  arrow(xB,ry,W*0.11,0,'#185FA5',4.5);tag('F = '+F+' N',xB+W*0.055,ry-H*0.085,'#185FA5','center',11);
  tag('free end',xA,ry-H*0.10,'#8a8f80','center',10);
  // standard marks
  for(let i=0;i<marks.length;i++){const x=xA+marks[i]*(xB-xA);
    sx.strokeStyle='rgba(27,35,72,.5)';sx.lineWidth=1.3;sx.beginPath();sx.moveTo(x,ry+wdt/2+3);sx.lineTo(x,ry+wdt/2+10);sx.stroke();
    tag(mlab[i],x,ry+wdt/2+19,'#1b2348','center',11);}
  // probe marker
  const mx=xA+f*(xB-xA);
  sx.strokeStyle='#185FA5';sx.lineWidth=2;sx.setLineDash([4,3]);
  sx.beginPath();sx.moveTo(mx,ry-H*0.13);sx.lineTo(mx,ry+wdt/2+12);sx.stroke();sx.setLineDash([]);
  sx.beginPath();sx.arc(mx,ry,4.5,0,7);sx.fillStyle='#185FA5';sx.fill();
  tag('T = '+T.toFixed(1).replace(/\.0$/,'')+' N',mx,ry-H*0.175,'#1b2348','center',13.5);
  // pop-up at a standard mark
  const nm=nearestMark();
  if(nm>=0) bubble(mx,ry-H*0.30,mlab[nm]+'  mark');
  // tension meter
  const mt=W*0.12,mr=W*0.88,my=H*0.84;
  sx.strokeStyle='rgba(27,35,72,.25)';sx.lineWidth=8;sx.lineCap='round';sx.beginPath();sx.moveTo(mt,my);sx.lineTo(mr,my);sx.stroke();
  sx.strokeStyle='#185FA5';sx.beginPath();sx.moveTo(mt,my);sx.lineTo(mt+(mr-mt)*(T/F),my);sx.stroke();
  tag('0',mt,my+15,'#8a8f80','center',9.5);tag('F',mr,my+15,'#8a8f80','center',9.5);
  tag('tension along the rope',(mt+mr)/2,my-15,'#5b6172','center',10);
}

function setLabel(){const nm=nearestMark();pval.textContent=nm>=0?mlab[nm]:(f<0.02?'free end':(f>0.98?'pull end':f.toFixed(2)));}
ptEl.addEventListener('input',()=>{f=+ptEl.value;setLabel();draw();});
window.addEventListener('resize',fit);
setLabel();fit();
</script></body></html>
