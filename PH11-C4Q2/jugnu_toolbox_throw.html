<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox Throw — Jugnu</title>
<style>
  :root{--navy:#1b2348;--gold:#ffcf33;--cream:#fcf4e0;--green:#2fa84f;--blue:#2e6fdb;--red:#d9483b}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#11162e;font-family:'Trebuchet MS','Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:10px}
  .app{width:min(94vw,420px);aspect-ratio:3/4;max-height:97svh;background:var(--cream);
    border:3px solid var(--navy);border-radius:20px;display:flex;flex-direction:column;
    overflow:hidden;padding:12px 14px 14px;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
  .title{text-align:center;color:var(--gold);font-weight:bold;font-style:italic;
    text-transform:uppercase;letter-spacing:.03em;font-size:14.5px;line-height:1.12;
    background:var(--navy);padding:7px 8px;border-radius:11px}
  .cond{text-align:center;background:#fff;color:var(--navy);font-weight:bold;font-size:14px;
    border-radius:11px;padding:6px 8px;border:2px solid var(--navy)}
  .cond small{font-weight:bold;font-size:10.5px;display:block;opacity:.7}
  .scene-wrap{flex:1;min-height:0;border:2px solid var(--navy);border-radius:13px;
    overflow:hidden;background:#0e1430}
  canvas{display:block;width:100%;height:100%}
  #controls{display:flex;flex-direction:column;gap:10px}
  .flabel{text-align:center;color:var(--navy);font-weight:bold;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:-4px}
  .btns{display:flex;gap:10px;justify-content:center}
  .dbtn{flex:1;max-width:150px;padding:11px 6px;border:2px solid var(--navy);border-radius:12px;
    background:var(--cream);color:var(--navy);font-size:15px;font-weight:bold;cursor:pointer;
    font-family:inherit;transition:.12s}
  .dbtn.active{background:var(--gold)}
  .play{width:54px;height:54px;border-radius:50%;border:3px solid var(--navy);background:var(--green);
    color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding-left:4px;align-self:center;transition:transform .1s;box-shadow:0 5px 0 #1d7a37}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a37}
  #resultBox{display:none;flex-direction:column;align-items:center;gap:9px;background:#fff;
    border:2px solid var(--navy);border-radius:13px;padding:13px 14px}
  .rhead{font-size:21px;font-weight:bold;line-height:1}
  .rsub{font-size:12.5px;font-weight:bold;color:var(--navy);text-align:center;line-height:1.3}
  .retry{padding:11px 24px;border-radius:26px;border:3px solid var(--navy);
    background:var(--cream);color:var(--navy);font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;
    box-shadow:0 5px 0 #c9bd8e;transition:transform .1s}
  .retry:active{transform:translateY(3px);box-shadow:0 2px 0 #c9bd8e}
  .status{text-align:center;color:var(--navy);font-weight:bold;font-size:13px;min-height:17px}
</style>
</head>
<body>
<div class="app">
  <div class="title">Throw the toolbox to move Jugnu</div>
  <div class="cond">Goal: get Jugnu to the spaceship
    <small>throwing the toolbox pushes Jugnu the opposite way</small></div>
  <div class="scene-wrap"><canvas id="scene"></canvas></div>
  <div id="controls">
    <div class="flabel">Throw the toolbox</div>
    <div class="btns" id="dpad">
      <button class="dbtn" data-d="left">&#8592; Throw Left</button>
      <button class="dbtn" data-d="right">Throw Right &#8594;</button>
    </div>
    <button class="play" id="play" aria-label="Play">&#9654;</button>
  </div>
  <div id="resultBox">
    <div class="rhead" id="rhead"></div>
    <div class="rsub" id="rsub"></div>
    <button class="retry" id="retry">&#8635; Try Again</button>
  </div>
  <div class="status" id="status"></div>
</div>

let dpr=1, CW=0, CH=0, pendingResize=true;
new ResizeObserver(()=>{ pendingResize=true; }).observe(cv);
function geom(){ midY=CH*0.5; shipX=CW*0.17; jugX0=CW*0.76; dockX=shipX+46; }
function applyResize(){
  const r=cv.getBoundingClientRect();
  if(Math.abs(r.width-CW)<0.5 && Math.abs(r.height-CH)<0.5) return;
  dpr=window.devicePixelRatio||1; CW=r.width; CH=r.height;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); makeStars(); geom();
  if(mode==='idle') resetIdle();                 // only re-center while idle
  else { jug.y=midY; tool.y=midY; }              // never reset a playing/finished round
}
function makeStars(){stars=[];const n=Math.round(CW*CH/2500);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*CW,y:Math.random()*CH,
    r:0.5+Math.random()*1.3,a:0.45+Math.random()*0.55});}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBg(){
  if(imgBg.complete&&imgBg.naturalWidth){
    const iw=imgBg.naturalWidth,ih=imgBg.naturalHeight,s=Math.max(CW/iw,CH/ih),w=iw*s,h=ih*s;
    ctx.drawImage(imgBg,(CW-w)/2,(CH-h)/2,w,h);
  }else{ctx.fillStyle='#0e1430';ctx.fillRect(0,0,CW,CH);}
  stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
}
function drawImgC(img,x,y,h){if(img.complete&&img.naturalWidth){
  const w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,x-w/2,y-h/2,w,h);}}
function drawToolbox(x,y,s){
  const w=s,h=s*0.72,rx=x-w/2,ry=y-h/2;
  ctx.lineJoin='round';ctx.lineWidth=2.4;ctx.strokeStyle='#15203f';
  ctx.beginPath();ctx.arc(x,ry,w*0.22,Math.PI,0);ctx.stroke();           // handle
  ctx.fillStyle='#d9483b';roundRect(rx,ry,w,h,3);ctx.fill();ctx.stroke();// body
  ctx.beginPath();ctx.moveTo(rx,ry+h*0.36);ctx.lineTo(rx+w,ry+h*0.36);ctx.stroke();
  ctx.fillStyle='#ffcf33';roundRect(x-2.6,ry+h*0.26,5.2,h*0.2,1);ctx.fill();ctx.stroke();
}

function resetIdle(){mode='idle';result='';sel&&0;
  jug={x:jugX0,y:midY,vx:0}; tool={x:jugX0-JUGH*0.30,y:midY+JUGH*0.10,vx:0,held:true};
  setButtons(false);setStatus();}
function play(){if(!sel){setStatus('pick');return;}
  const d=DIR[sel];
  jug={x:jugX0,y:midY,vx:-VJ*d};                 // recoil opposite to throw
  tool={x:jugX0-JUGH*0.30,y:midY+JUGH*0.10,vx:VT*d,held:false};
  mode='playing';setStatus();}

const controlsEl=document.getElementById('controls'), retryBtn=document.getElementById('retry');
const resultBox=document.getElementById('resultBox'), rhead=document.getElementById('rhead'), rsub=document.getElementById('rsub');
function setButtons(done){controlsEl.style.display=done?'none':'flex';resultBox.style.display=done?'flex':'none';}
function setStatus(flag){const el=document.getElementById('status');
  if(flag==='pick'){el.textContent='Pick a throw direction first';return;}
  if(mode==='idle'){el.textContent = sel?'Direction chosen — press Play':'Which way should Jugnu throw the toolbox?';return;}
  if(mode==='playing'){el.textContent = (sel==='right')?'Toolbox flies right → Jugnu recoils left':'Toolbox flies left → Jugnu pushed right';return;}
  el.textContent='';
}

function finish(){
  const ok=result==='right';
  rhead.textContent=ok?'\u2713 Correct!':'\u2717 Incorrect';
  rhead.style.color=ok?'#2fa84f':'#d9483b';
  rsub.textContent=ok?'Toolbox thrown right — Jugnu recoils left and reaches the ship.'
                     :'Toolbox thrown left — Jugnu is pushed right, away from the ship.';
  mode='done';setButtons(true);setStatus();
}

function draw(){
  drawBg();
  drawImgC(imgShip, shipX, midY, SHIPH);          // spaceship (left)
  drawImgC(imgAstro, jug.x, jug.y, JUGH);          // Jugnu (right)
  if(tool.x>-40 && tool.x<CW+40) drawToolbox(tool.x, tool.y, 24); // toolbox always in front
}
function loop(now){
  if(pendingResize){pendingResize=false;applyResize();}
  const dt=Math.min((now-(loop.last||now))/1000,0.05); loop.last=now;
  if(mode==='playing'){
    jug.x+=jug.vx*dt; tool.x+=tool.vx*dt;
    if(sel==='right'){            // correct: recoiling left toward the ship
      if(jug.x<=dockX){ jug.x=dockX; result='right'; finish(); }
    }else{                        // incorrect: pushed right toward the edge
      if(jug.x>=CW-30){ jug.x=CW-30; result='wrong'; finish(); }
    }
  }
  draw();requestAnimationFrame(loop);
}
document.getElementById('dpad').addEventListener('click',e=>{const b=e.target.closest('.dbtn');if(!b)return;
  sel=b.dataset.d;document.querySelectorAll('.dbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');resetIdle();});
document.getElementById('play').addEventListener('click',play);
retryBtn.addEventListener('click',()=>{sel=null;document.querySelectorAll('.dbtn').forEach(x=>x.classList.remove('active'));resetIdle();});
resetIdle();requestAnimationFrame(loop);
</script>
