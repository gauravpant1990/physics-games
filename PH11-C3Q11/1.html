<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collision of Two Projectiles</title>
<style>
  :root{
    --navy:#1b2348; --gold:#ffcf33; --cream:#fcf4e0;
    --green:#2fa84f; --blue:#2e6fdb; --red:#d9483b;
    --sky:#eef5ff; --ground:#e9dcae;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#11162e;font-family:'Trebuchet MS','Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:10px;
  }
  .app{
    width:min(94vw,430px);aspect-ratio:3/4;max-height:97svh;
    background:var(--cream);border:3px solid var(--navy);border-radius:20px;
    display:flex;flex-direction:column;overflow:hidden;
    padding:12px 14px 14px;gap:9px;box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .title{
    text-align:center;color:var(--gold);font-weight:bold;font-style:italic;
    text-transform:uppercase;letter-spacing:.04em;font-size:15px;line-height:1.1;
    background:var(--navy);padding:7px 8px;border-radius:11px;
  }
  .cond{
    text-align:center;background:#fff;color:var(--navy);
    font-weight:bold;font-size:18px;border-radius:11px;padding:5px 8px;
    border:2px solid var(--navy);
  }
  .cond small{font-weight:bold;font-size:11px;display:block;opacity:.8;letter-spacing:.02em}
  .desc{text-align:center;color:var(--navy);font-weight:bold;font-size:12px;opacity:.7;letter-spacing:.02em}
  .frames{display:flex;gap:7px}
  .fbtn{
    flex:1;padding:9px 4px;font-size:13px;font-weight:bold;cursor:pointer;
    border:2px solid var(--navy);border-radius:11px;background:var(--cream);
    color:var(--navy);font-family:inherit;transition:.12s;
  }
  .fbtn.active{background:var(--navy);color:#fff}
  .scene-wrap{
    flex:1;min-height:0;border:2px solid var(--navy);border-radius:13px;
    overflow:hidden;background:var(--sky);
  }
  canvas{display:block;width:100%;height:100%}
  .flabel{text-align:center;color:var(--navy);font-weight:bold;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;opacity:.65}
  .play{
    align-self:center;width:62px;height:62px;border-radius:50%;
    border:3px solid var(--navy);background:var(--green);color:#fff;
    font-size:26px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;padding-left:4px;transition:transform .1s;
    box-shadow:0 5px 0 #1d7a37;
  }
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a37}
</style>
</head>
<body>
<div class="app">
  <div class="title">Visualization on Collision between Projectiles</div>
  <div class="cond"><small>Condition for collision</small>v<sub>1</sub> sin θ<sub>1</sub> = v<sub>2</sub> sin θ<sub>2</sub></div>
  <div class="scene-wrap"><canvas id="scene"></canvas></div>
  <div class="flabel">Frame</div>
  <div class="frames" id="frames">
    <button class="fbtn active" data-f="ground">🌍 Ground</button>
    <button class="fbtn" data-f="A">🟢 Ball A</button>
    <button class="fbtn" data-f="B">🔵 Ball B</button>
  </div>
  <button class="play" id="play" aria-label="Play">▶</button>
</div>

<script>
const g=9.8;
// Ground launch: A from (0,0) vel(3, 9);  B from (9,0) vel(-6, 9).
// vertical speeds equal (9 = 9)  ->  v1 sinθ1 = v2 sinθ2  -> always same height.
const A0=0, B0=9, uy=9, uxA=3, uxB=6;     // closing speed 9, gap 9  => collide at t=1
const TC=1.0;                              // collision time (same in every frame)
const REALDUR=2600;                        // ms playback
const WXMIN=-1, WXMAX=10, WYMIN=0, WYMAX=4.6;
const yLevel=2.25;                         // mid height used in relative frames

const COL={A:'#2fa84f',B:'#2e6fdb',gold:'#ffcf33',navy:'#1b2348',red:'#d9483b'};

let frame='ground', state='idle', startTs=0, simT=0, cap='';

const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
let dpr=1, CW=0, CH=0, S=1, mX=0, gY=0;
new ResizeObserver(()=>{
  const r=cv.getBoundingClientRect();
  dpr=window.devicePixelRatio||1; CW=r.width; CH=r.height;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); layout();
}).observe(cv);

function layout(){
  const pad=16;
  S=Math.min((CW-2*pad)/(WXMAX-WXMIN),(CH-2*pad)/(WYMAX-WYMIN));
  const dW=(WXMAX-WXMIN)*S, dH=(WYMAX-WYMIN)*S;
  mX=(CW-dW)/2; gY=(CH-dH)/2+dH;
}
const X=wx=>mX+(wx-WXMIN)*S;
const Y=wy=>gY-wy*S;

/* ---------- drawing helpers ---------- */
function ball(x,y,col,letter,r){
  r=r||9;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.lineWidth=2.2;ctx.strokeStyle='#fff';ctx.stroke();
  if(letter){
    ctx.fillStyle=COL.navy;ctx.font='bold 13px Trebuchet MS';
    ctx.textAlign='center';ctx.fillText(letter,x,y-r-5);
  }
}
function arrow(x1,y1,x2,y2,col,w){
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function burst(x,y,k){
  k=k||1;
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle=COL.gold;ctx.lineWidth=3;
  for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(8+14*k,0);ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fillStyle=COL.red;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.restore();
  ctx.fillStyle=COL.red;ctx.font='bold 17px Trebuchet MS';ctx.textAlign='center';
  ctx.fillText('💥',x,y-22);
}

/* ---------- world physics (ground positions) ---------- */
function gPos(t){return [uxA*t, uy*t-0.5*g*t*t];}            // ball A
function gPosB(t){return [B0-uxB*t, uy*t-0.5*g*t*t];}        // ball B
function renderWorld(t){
  // ground frame = fixed world; ball frame = ride the ball:
  // the ridden ball is pinned at screen centre, only the other ball + ground move.
  let sx, sy, Sc=0, aY=0, ride=null, move=null;
  if(frame==='ground'){
    sx=wx=>X(wx); sy=wy=>Y(wy);
  }else{
    ride=(frame==='A'?gPos:gPosB);            // ball you ride
    move=(frame==='A'?gPosB:gPos);            // the other ball
    const R=ride(t);
    Sc=0.40*CW/9;                              // 9 m gap spans 40% of the width
    aY=CH*0.42;                                // ridden ball fixed at centre height
    sx=wx=>CW/2+(wx-R[0])*Sc;
    sy=wy=>aY-(wy-R[1])*Sc;
  }

  // ground band + line (drops away in a ball frame as we rise with the ball)
  const gl=sy(0), top=Math.max(gl,0);
  if(gl<CH){ctx.fillStyle='#e9dcae';ctx.fillRect(0,top,CW,CH-top);}
  if(gl>=0&&gl<=CH){ctx.strokeStyle='#b9a96a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,gl);ctx.lineTo(CW,gl);ctx.stroke();}
  // ground tufts -> make the world's motion visible
  ctx.strokeStyle='rgba(150,135,80,.75)';ctx.lineWidth=2;
  for(let wx=-4;wx<=16;wx++){const x=sx(wx),y=sy(0);
    if(x<-8||x>CW+8||y<0||y>CH)continue;
    ctx.beginPath();ctx.moveTo(x,y+2);ctx.lineTo(x,Math.min(y+11,CH));ctx.stroke();}

  const pa=gPos(t),pb=gPosB(t);
  const aS=[sx(pa[0]),sy(pa[1])], bS=[sx(pb[0]),sy(pb[1])];

  if(frame==='ground'){
    // ground frame: trace BOTH balls' real parabolas over a static world
    if(state!=='idle'){
      const trail=(fn,col)=>{ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();
        for(let i=0;i<=60;i++){const p=fn(t*i/60);i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));}
        ctx.stroke();};
      trail(gPos,'rgba(47,168,79,.9)');trail(gPosB,'rgba(46,111,219,.9)');
    }
  }else{
    // relative frame: the ridden ball is the origin -> NO trail for it.
    // the other ball's path is its position RELATIVE to the ridden ball; since both
    // share the same vertical motion (they collide), that relative path is HORIZONTAL.
    const fS = frame==='A'?aS:bS;                 // ridden ball (centre)
    const otherCol = frame==='A'?'rgba(46,111,219,.9)':'rgba(47,168,79,.9)';
    const rel=tt=>{const o=move(tt),r=ride(tt);   // other ball relative to ridden ball
      return [CW/2+(o[0]-r[0])*Sc, aY-(o[1]-r[1])*Sc];};
    if(state==='idle'){
      const m=frame==='A'?bS:aS;
      ctx.setLineDash([7,6]);ctx.strokeStyle='rgba(27,35,72,.30)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(m[0],m[1]);ctx.lineTo(fS[0],fS[1]);ctx.stroke();ctx.setLineDash([]);
    }else{
      ctx.strokeStyle=otherCol;ctx.lineWidth=3;ctx.beginPath();
      for(let i=0;i<=60;i++){const p=rel(t*i/60);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
      ctx.stroke();
    }
    // ring marks the ball you ride
    ctx.beginPath();ctx.arc(fS[0],fS[1],15,0,7);ctx.strokeStyle='rgba(27,35,72,.55)';ctx.lineWidth=2;ctx.stroke();
  }

  if(state==='done'){burst(aS[0],aS[1]);}
  else{ball(aS[0],aS[1],COL.A,'A',8);ball(bS[0],bS[1],COL.B,'B',8);}
}

/* ---------- main loop ---------- */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#eef5ff';ctx.fillRect(0,0,CW,CH); // same sky background in every frame
  renderWorld(simT);
}
function loop(now){
  if(state==='playing'){
    const el=(now-startTs)/REALDUR;
    simT=Math.min(el,1)*TC;
    if(el>=1){simT=TC;state='done';setCaption();}
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- captions ---------- */
function setCaption(){}  // captions removed

/* ---------- controls ---------- */
function reset(){state='idle';simT=0;setCaption();}
document.getElementById('frames').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn');if(!b)return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');frame=b.dataset.f;reset();
});
document.getElementById('play').addEventListener('click',()=>{
  state='playing';startTs=performance.now();setCaption();
});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
