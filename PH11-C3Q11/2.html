<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile — Pick θ₂</title>
<style>
  :root{
    --navy:#1b2348; --gold:#ffcf33; --cream:#fcf4e0;
    --green:#2fa84f; --blue:#2e6fdb; --red:#d9483b;
    --sky:#eef5ff; --ground:#e9dcae;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#11162e;font-family:'Trebuchet MS','Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:10px;
  }
  .app{
    width:min(94vw,430px);aspect-ratio:3/4;max-height:97svh;
    background:var(--cream);border:3px solid var(--navy);border-radius:20px;
    display:flex;flex-direction:column;overflow:hidden;
    padding:12px 14px 14px;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .title{
    text-align:center;color:var(--gold);font-weight:bold;font-style:italic;
    text-transform:uppercase;letter-spacing:.04em;font-size:15px;line-height:1.1;
    background:var(--navy);padding:7px 8px;border-radius:11px;
  }
  .info-box{
    background:#fff;border:2px solid var(--navy);border-radius:11px;
    padding:8px 12px;display:flex;flex-direction:column;gap:3px;text-align:center;
  }
  .info-box span{font-size:13px;font-weight:bold;color:var(--navy)}
  .info-box .find{font-size:12px;color:#6b6f86;font-weight:bold;letter-spacing:.02em}
  .scene-wrap{
    flex:1;min-height:0;border:2px solid var(--navy);border-radius:13px;
    overflow:hidden;background:var(--sky);
  }
  canvas{display:block;width:100%;height:100%}
  .bottom{display:flex;flex-direction:column;gap:7px}
  .qlabel{
    text-align:center;font-weight:bold;font-size:13px;color:var(--navy);
    background:#fff;border:2px solid var(--navy);border-radius:11px;padding:5px 8px;
  }
  .options{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .opt{
    padding:10px 4px;font-size:16px;font-weight:bold;font-family:inherit;
    border:2px solid var(--navy);border-radius:11px;background:var(--cream);
    color:var(--navy);cursor:pointer;text-align:center;transition:.12s;
  }
  .opt:hover{background:#ede8d8}
  .opt.selected{background:var(--navy);color:var(--gold)}
  .play{
    align-self:center;width:62px;height:62px;border-radius:50%;
    border:3px solid var(--navy);background:#aaa;color:#fff;
    font-size:26px;cursor:default;display:flex;align-items:center;
    justify-content:center;padding-left:4px;
    box-shadow:0 5px 0 #888;transition:transform .1s;opacity:.45;
  }
  .play.ready{background:var(--green);box-shadow:0 5px 0 #1d7a37;cursor:pointer;opacity:1}
  .play.ready:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a37}

  .result-banner{
    text-align:center;font-weight:bold;font-size:13px;
    border-radius:11px;padding:7px 10px;border:2px solid var(--navy);
  }
  .result-banner.correct{background:#d4f5ea;color:#0a5c3a}
  .result-banner.wrong{background:#fde8e8;color:#8a1010}
  .insight{
    background:#fff;border:2px solid var(--navy);border-radius:11px;
    padding:8px 10px;font-size:12px;color:var(--navy);
    line-height:1.65;text-align:center;font-weight:bold;
  }
  .try-btn{
    align-self:center;padding:9px 28px;font-size:14px;font-weight:bold;font-family:inherit;
    border:2px solid var(--navy);border-radius:22px;background:var(--cream);
    color:var(--navy);cursor:pointer;transition:.12s;
  }
  .try-btn:hover{background:var(--navy);color:var(--gold)}

</style>
</head>
<body>
<div class="app">

  <div class="title">Which θ₂ causes a collision?</div>

  <div class="info-box">
    <span>v₁ = 10 m/s &nbsp;|&nbsp; θ₁ = 30° &nbsp;|&nbsp; v₂ = 12 m/s</span>
    <span class="find">Find θ₂ that causes a collision</span>
  </div>

  <div class="scene-wrap"><canvas id="scene"></canvas></div>

  <div class="bottom">
    <div id="s-mcq">
      <div class="qlabel" id="qlabel" style="margin-bottom:7px">Pick θ₂ for Ball 2 (launches from right) ↓</div>
      <div class="options" id="opts"></div>
    </div>
    <button class="play" id="play">▶</button>
    <div id="s-result" style="display:none;flex-direction:column;gap:7px">
      <div class="result-banner" id="rbanner"></div>
      <div class="insight" id="insight"></div>
      <button class="try-btn" id="trybtn">↩ Try Again</button>
    </div>
  </div>

</div>
<script>
const g = 10;

// Ball 1: from x=0, angle 30°, speed 20 m/s  → vx1=+17.3, vy1=10
// Ball 2: from x=SPAN, angle θ₂, speed 20 m/s → vx2=-v2cos(θ₂), vy2=v2sin(θ₂)
// Collision condition: vy1 = vy2  →  v1·sinθ1 = v2·sinθ2
// With same speed: sinθ1 = sinθ2 only if θ2=θ1 OR θ2=180-θ1
// But complementary angles give same RANGE, not collision.
// Actual collision: they must be at same (x,y) at same t.
// x1(t)=ux1·t,  x2(t)=SPAN-ux2·t → meet when ux1·t + ux2·t = SPAN → t* = SPAN/(ux1+ux2)
// y1(t*)=y2(t*) only if uy1=uy2 → same vertical speed → θ1+θ2=90° (complementary) with same v
// With v1=v2=20, θ1=30: uy1=20sin30=10, need uy2=10 → θ2=30° OR θ2=150° → but 30°<90 → θ2=30°
// Wait: uy2=v2·sinθ2=10 → sinθ2=0.5 → θ2=30°. But that means both same angle.
// Actually for collision: uy1=uy2 (equal vertical speeds). v1sinθ1=v2sinθ2.
// v1=v2=20, θ1=30° → uy1=10. So uy2=10 → θ2=30°. But then ux2=20cos30=17.3 same as ux1.
// They'd never meet horizontally since they approach at 2*ux = 34.6, SPAN=ux1*tf=17.3*2=34.6 → t*=1s ✓
// So CORRECT=30° for collision? Let me reconsider with θ1=60° for variety.
// θ1=60: uy1=20sin60=17.3, ux1=20cos60=10. tf=2*17.3/10=3.46s. SPAN=10*3.46=34.6m
// uy2 must=17.3 → sinθ2=17.3/20=0.866 → θ2=60°
// That's same angle, too obvious. Let's use θ1=30, θ2=30 collision, but offer θ2∈{15,30,45,60}
// CORRECT=30 (same vy). Options: 15,30,45,60.

// Physics design:
// V1=10, θ1=30° → uy1=5, ux1=8.66, TF1=1s, SPAN=8.66m  (short enough for ball-frame view)
// V2=12, collision needs uy2=uy1=5 → sinθ2=5/12 → θ2≈24.6° ≈ 25°
// Options: 15, 25, 40, 55  — correct=25
const V1=10, T1=30, V2=12, CORRECT=25;
const OPTIONS=[15,25,40,55];
const REALDUR=1800;
const REALDUR_BALL=3000;

const ux1 = V1*Math.cos(T1*Math.PI/180);  // ~8.66
const uy1 = V1*Math.sin(T1*Math.PI/180);  // 5
const TF1 = 2*uy1/g;                       // 1 s
const SPAN = ux1*TF1;                      // ~8.66 m

// World bounds — WYMAX covers max peak height with margin
const WXMIN=-1, WXMAX=SPAN+1, WYMIN=0, WYMAX=3;

let chosen=null, ux2=0,uy2=0,TF2=0;
let frame='ground', state='idle', startTs=0, simT=0;

// Shared animation time runs from 0 → TC (collision/end time)
// For correct answer, balls collide at t* = SPAN/(ux1+ux2)
// We animate to max(TF1,TF2) to show full trajectories, but STOP at collision for correct.
let TC = TF1; // updated when option chosen

function setOption(deg){
  chosen=deg;
  ux2 = V2*Math.cos(deg*Math.PI/180);
  uy2 = V2*Math.sin(deg*Math.PI/180);
  TF2 = 2*uy2/g;
  if(deg===CORRECT){
    TC = SPAN/(ux1+ux2); // collision time
  } else {
    TC = Math.max(TF1,TF2); // full flight
  }
}

// Position functions — clamped to each ball's own flight time so they stop at landing
function posA(t){ const tc=Math.min(t,TF1); return [ux1*tc, Math.max(0,uy1*tc-0.5*g*tc*tc)]; }
function posB(t){ if(!chosen)return [SPAN,0]; const tc=Math.min(t,TF2); return [SPAN-ux2*tc, Math.max(0,uy2*tc-0.5*g*tc*tc)]; }

const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
let dpr=1, CW=0, CH=0, S=1, mX=0, gY=0;

new ResizeObserver(()=>{
  const r=cv.getBoundingClientRect();
  dpr=window.devicePixelRatio||1; CW=r.width; CH=r.height;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layout();
}).observe(cv);

function layout(){
  const pad=16;
  S = Math.min((CW-2*pad)/(WXMAX-WXMIN), (CH-2*pad)/(WYMAX-WYMIN));
  const dW=(WXMAX-WXMIN)*S, dH=(WYMAX-WYMIN)*S;
  mX=(CW-dW)/2; gY=(CH-dH)/2+dH;
}

// Ground-frame coordinate transforms
const X = wx => mX+(wx-WXMIN)*S;
const Y = wy => gY-wy*S;

/* ── drawing helpers ── */
function drawBall(x,y,col,label,r){
  r=r||8;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.lineWidth=2.2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#1b2348';ctx.font='bold 13px Trebuchet MS';
  ctx.textAlign='center';ctx.fillText(label,x,y-r-4);
}
function arrow(x1,y1,x2,y2,col,w){
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function burst(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='#ffcf33';ctx.lineWidth=3;
  for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(22,0);ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,7,0,7);
  ctx.fillStyle='#d9483b';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.restore();
  ctx.font='bold 16px Trebuchet MS';ctx.textAlign='center';
  ctx.fillText('💥',x,y-20);
}

/* ── render world (same pattern as projectile_min_sep) ── */
function renderWorld(t){
  let sx, sy;

  if(frame==='ground'){
    sx = wx => X(wx);
    sy = wy => Y(wy);
  } else {
    // Pin the ridden ball offset toward its own side so the other ball stays in frame.
    // Ball 1 is on the left → pin at 20% from left; Ball 2 on right → pin at 80%.
    const ride = frame==='A' ? posA(t) : posB(t);
    const pinX = frame==='A' ? CW*0.20 : CW*0.80;
    const aY = CH*0.55;
    sx = wx => pinX + (wx-ride[0])*S;
    sy = wy => aY   - (wy-ride[1])*S;
  }

  // ground band
  const gl=sy(0), top=Math.max(gl,0);
  if(gl<CH){ctx.fillStyle='#e9dcae';ctx.fillRect(0,top,CW,CH-top);}
  if(gl>=0&&gl<=CH){
    ctx.strokeStyle='#b9a96a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,gl);ctx.lineTo(CW,gl);ctx.stroke();
  }
  // tufts
  ctx.strokeStyle='rgba(150,135,80,.75)';ctx.lineWidth=2;
  for(let wx=WXMIN-2;wx<=WXMAX+2;wx++){
    const x=sx(wx),y=sy(0);
    if(x<-8||x>CW+8)continue;
    ctx.beginPath();ctx.moveTo(x,y+2);ctx.lineTo(x,Math.min(y+11,CH));ctx.stroke();
  }

  const pa=posA(t), pb=chosen?posB(t):[SPAN,0];
  const aS=[sx(pa[0]),sy(pa[1])];
  const bS=[sx(pb[0]),sy(pb[1])];

  // trails
  if(state!=='idle'){
    // Ball 1 trail
    ctx.strokeStyle='rgba(232,124,42,.9)';ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<=60;i++){
      const tt=Math.min(t*i/60, TF1);
      const p=posA(tt);
      i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));
    }
    ctx.stroke();
    // Ball 2 trail
    if(chosen){
      ctx.strokeStyle='rgba(46,111,219,.9)';ctx.lineWidth=3;ctx.beginPath();
      for(let i=0;i<=60;i++){
        const tt=Math.min(t*i/60, TF2);
        const p=posB(tt);
        i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));
      }
      ctx.stroke();
    }
  }

  // ring on ridden ball in relative frames
  if(frame!=='ground'){
    const fS=frame==='A'?aS:bS;
    const pinX = frame==='A' ? CW*0.20 : CW*0.80;
    ctx.beginPath();ctx.arc(fS[0],fS[1],14,0,7);
    ctx.strokeStyle='rgba(27,35,72,.55)';ctx.lineWidth=2;ctx.stroke();
    // eye-level dashed line
    ctx.setLineDash([4,8]);ctx.strokeStyle='rgba(27,35,72,.2)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,fS[1]);ctx.lineTo(CW,fS[1]);ctx.stroke();
    ctx.setLineDash([]);
  }



  // burst on collision (done + correct)
  if(state==='done'&&chosen===CORRECT){
    burst(aS[0],aS[1]);
  } else {
    drawBall(aS[0],aS[1],'#e87c2a','1');
    if(chosen) drawBall(bS[0],bS[1],'#2e6fdb','2');
  }
}

/* ── main loop ── */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#eef5ff';ctx.fillRect(0,0,CW,CH);
  renderWorld(simT);
}

function loop(now){
  if(state==='playing'){
    const dur = frame==='ground' ? REALDUR : REALDUR_BALL;
    const el=(now-startTs)/dur;
    simT=Math.min(el,1)*TC;
    if(el>=1){simT=TC;state='done';showResult();}
  }
  draw();
  requestAnimationFrame(loop);
}

/* ── controls ── */
// Options
const optGrid=document.getElementById('opts');
OPTIONS.forEach(deg=>{
  const b=document.createElement('button');
  b.className='opt';b.textContent=deg+'°';
  b.addEventListener('click',()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    setOption(deg);
    // hide MCQ, show play
    document.getElementById('opts').style.display='none';
    document.getElementById('qlabel').style.display='none';
    document.getElementById('play').classList.add('ready');
    state='idle';simT=0;
  });
  optGrid.appendChild(b);
});

document.getElementById('play').addEventListener('click',()=>{
  if(!chosen)return;
  state='playing';startTs=performance.now();
  document.getElementById('play').textContent='▶';
});

function showResult(){
  document.getElementById('play').style.display='none';
  document.getElementById('s-result').style.display='flex';
  const ok=(chosen===CORRECT);
  const b=document.getElementById('rbanner');
  b.className='result-banner '+(ok?'correct':'wrong');
  b.textContent=ok?'✓ Correct! They collide mid-air! 💥':'✗ Not quite — they miss each other';
  document.getElementById('insight').innerHTML=ok
    ?`v₁ sin θ₁ = v₂ sin θ₂ → equal vertical speeds<br>Both at same height at every instant!`
    :`Need v₁ sin θ₁ = v₂ sin θ₂<br>Correct answer: θ₂ = <span style="color:#d9483b">25°</span>`;
}

document.getElementById('trybtn').addEventListener('click',()=>{
  chosen=null;state='idle';simT=0;
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
  document.getElementById('opts').style.display='grid';
  document.getElementById('qlabel').style.display='block';
  document.getElementById('s-result').style.display='none';
  const pb=document.getElementById('play');
  pb.classList.remove('ready');pb.textContent='▶';pb.style.display='flex';
});

requestAnimationFrame(loop);
</script>
</body>
</html>
