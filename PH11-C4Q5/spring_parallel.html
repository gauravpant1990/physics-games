<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Springs in Parallel</title>
<style>
  :root{--navy:#1b2348;--blue:#185FA5;--amber:#E0892A;--green:#1D9E75}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f2efe9;font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:min(94vw,360px)}
  .head{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .sub{font-size:11px;color:#5a6080;line-height:1.4;font-weight:500}
  .intro{margin-bottom:7px}.intro .head{margin-bottom:2px}.intro .sub{margin-bottom:0}
  .card{background:#fff;border-radius:12px;border:2px solid var(--navy);overflow:hidden;margin-bottom:7px}
  .card.pad{padding:10px 11px}
  canvas{display:block;width:100%;height:auto}
  .cap{font-size:11px;font-weight:700;color:var(--navy);line-height:1.4;padding:8px 12px;min-height:30px}
  .cap b{font-weight:800}
  .ctrl{display:flex;align-items:center;gap:9px}
  .ctrl label{font-size:11.5px;font-weight:700;color:var(--navy);min-width:90px;text-transform:uppercase;letter-spacing:.04em}
  input[type=range]{flex:1;accent-color:var(--navy);cursor:pointer;height:22px}
  .val{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:20px;padding:3px 9px;min-width:56px;text-align:center}
  footer{margin-top:8px;text-align:center;font-size:10px;color:#888780;padding-top:7px;border-top:.5px solid rgba(0,0,0,.12)}
</style></head>
<body>
<div class="wrap">
  <div class="card pad intro">
    <div class="head">Two springs in parallel</div>
    <div class="sub">Both springs stretch by the same amount, so their forces add up (F = F1 + F2). The stiffer spring takes the larger share.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas>
    <div class="cap" id="cap"></div></div>
  <div class="card pad">
    <div class="ctrl"><label>Applied force</label>
      <input type="range" id="f" min="0" max="200" step="10" value="100">
      <span class="val" id="fv">100 N</span></div>
  </div>
  <footer>Laws of Motion &middot; Springs in parallel</footer>
</div>
<script>
const K1=200,K2=300;let F=100;
const scn=document.getElementById('scene'),sx=scn.getContext('2d'),cap=document.getElementById('cap');
let W=360,H=281;const ASPECT=0.78;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<2&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(180,(avail-chrome)/ASPECT));wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}}
function arrow(x,y,dx,dy,col,wd){const a=Math.atan2(dy,dx),h=8+wd,len=Math.hypot(dx,dy);sx.save();sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  const ex=x+dx,ey=y+dy;sx.beginPath();sx.moveTo(x,y);sx.lineTo(len>h?ex-h*0.7*Math.cos(a):x,len>h?ey-h*0.7*Math.sin(a):y);sx.stroke();
  sx.beginPath();sx.moveTo(ex,ey);sx.lineTo(ex-h*Math.cos(a-0.45),ey-h*Math.sin(a-0.45));sx.lineTo(ex-h*Math.cos(a+0.45),ey-h*Math.sin(a+0.45));sx.closePath();sx.fill();sx.restore();}
function tag(t,x,y,col,al,sz){sx.save();sx.font='800 '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';sx.textBaseline='middle';
  sx.lineWidth=3.5;sx.strokeStyle='rgba(255,255,255,.95)';sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);sx.restore();}
function wall(x,y0,y1){sx.save();sx.strokeStyle='#1b2348';sx.lineWidth=2.5;sx.beginPath();sx.moveTo(x,y0);sx.lineTo(x,y1);sx.stroke();
  sx.lineWidth=1.2;sx.strokeStyle='#8a8fa3';for(let yy=y0;yy<y1;yy+=8){sx.beginPath();sx.moveTo(x,yy+8);sx.lineTo(x-7,yy);sx.stroke();}sx.restore();}
function spring(a,b,y,coils,amp,col,lw){sx.save();sx.strokeStyle=col;sx.lineWidth=lw;sx.lineCap='round';sx.lineJoin='round';
  const lead=Math.min(11,(b-a)*0.14),L=b-a-2*lead;sx.beginPath();sx.moveTo(a,y);sx.lineTo(a+lead,y);
  const seg=80;for(let i=0;i<=seg;i++){const t=i/seg;sx.lineTo(a+lead+t*L,y+amp*Math.sin(t*coils*2*Math.PI));}
  sx.lineTo(b-lead,y);sx.lineTo(b,y);sx.stroke();sx.restore();}

function draw(){sx.clearRect(0,0,W,H);
  const PM=W*0.65;                       // px per metre
  const x=F/(K1+K2);                     // same for both
  const xp=x*PM, kf=(W*0.15)/200;        // px per N
  const F1=K1*x, F2=K2*x;
  const wx=W*0.16, L0=W*0.30, y1=H*0.36, y2=H*0.64, midY=(y1+y2)/2;
  const bx0=wx+L0, xb=bx0+xp, barW=W*0.04;
  // walls
  wall(wx,y1-H*0.12,y2+H*0.12);
  // natural-length reference
  sx.save();sx.strokeStyle='rgba(27,35,72,.28)';sx.lineWidth=1.2;sx.setLineDash([4,4]);
  sx.beginPath();sx.moveTo(bx0,y1-H*0.16);sx.lineTo(bx0,y2+H*0.22);sx.stroke();sx.restore();
  // springs
  spring(wx,xb,y1,8,6,'#185FA5',3);
  spring(wx,xb,y2,8,6,'#E0892A',3);
  // moving bar
  sx.fillStyle='#cdd6e6';sx.strokeStyle='#1b2348';sx.lineWidth=2;
  sx.beginPath();sx.rect(xb,y1-H*0.10,barW,(y2-y1)+H*0.20);sx.fill();sx.stroke();
  // each spring is stretched: pulling force F1/F2 at the free (bar) end + wall reaction at the fixed end
  if(F>0){
    arrow(xb,y1,F1*kf+2,0,'#E24B4A',3);tag('F\u2081',xb+(F1*kf+2)+7,y1,'#E24B4A','left',9.5);
    arrow(xb,y2,F2*kf+2,0,'#E24B4A',3);tag('F\u2082',xb+(F2*kf+2)+7,y2,'#E24B4A','left',9.5);
    arrow(wx,y1,-(F1*kf+2),0,'#E24B4A',3);
    arrow(wx,y2,-(F2*kf+2),0,'#E24B4A',3);
    tag('reaction',wx-4,midY,'#E24B4A','right',9);
  }
  // k labels
  tag('k\u2081 = 200',wx+L0*0.5,y1-H*0.13,'#185FA5','center',9.5);
  tag('k\u2082 = 300',wx+L0*0.5,y2+H*0.13,'#E0892A','center',9.5);
  // shared stretch dimension
  const dyy=y2+H*0.20;sx.strokeStyle='#1D9E75';sx.lineWidth=1.3;
  sx.beginPath();sx.moveTo(bx0,dyy-4);sx.lineTo(bx0,dyy+4);sx.moveTo(xb,dyy-4);sx.lineTo(xb,dyy+4);sx.stroke();
  if(xp>6){arrow(bx0,dyy,xp,0,'#1D9E75',1.8);arrow(xb,dyy,-xp,0,'#1D9E75',1.8);}
  tag('x = '+(x*100).toFixed(0)+' cm (same for both)',(bx0+xb)/2,dyy+12,'#1D9E75','center',9.5);

  cap.innerHTML='<b>F = '+F+' N</b> = F\u2081(<b>'+F1.toFixed(0)+'</b>) + F\u2082(<b>'+F2.toFixed(0)+'</b>) &nbsp; same stretch x=<b>'+(x*100).toFixed(0)+' cm</b>';
}
function setF(v){F=+v;document.getElementById('fv').textContent=F+' N';draw();}
document.getElementById('f').addEventListener('input',e=>setF(e.target.value));
window.addEventListener('resize',()=>{fit();draw();});
fit();setF(100);
</script></body></html>
