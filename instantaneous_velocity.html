<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instantaneous Velocity — Secant to Tangent</title>
<style>
  :root {
    --bg:#ffffff; --bg2:#f5f5f3; --bg3:#ebebeb;
    --text:#1a1a18; --text2:#5f5e5a; --text3:#888780;
    --border:rgba(0,0,0,0.13); --border2:rgba(0,0,0,0.25);
    --radius:8px; --radius-lg:12px;
    --mono:'Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1a1a1a; --bg2:#252525; --bg3:#303030;
      --text:#f0f0ee; --text2:#a0a09a; --text3:#666660;
      --border:rgba(255,255,255,0.13); --border2:rgba(255,255,255,0.25);
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg);color:var(--text);
    font-family:var(--sans);min-height:100vh;
    display:flex;justify-content:center;
    padding:20px 12px 40px;
  }
  .wrap{width:100%;max-width:420px}

  .curve-row{display:flex;gap:6px;margin-bottom:10px}
  .cbtn{
    flex:1;padding:8px 4px;font-size:12px;font-weight:500;
    border:0.5px solid var(--border2);border-radius:var(--radius);
    background:var(--bg);color:var(--text2);
    cursor:pointer;text-align:center;font-family:var(--sans);
    transition:background .12s,color .12s;
  }
  .cbtn:hover{background:var(--bg2)}
  .cbtn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  .cvs-wrap{
    border-radius:var(--radius-lg);overflow:hidden;
    border:0.5px solid var(--border);margin-bottom:10px;
  }
  canvas.main{display:block;width:100%}

  .ctrl-block{
    margin-bottom:10px;background:var(--bg2);
    border-radius:var(--radius);padding:10px 12px;
  }
  .ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .ctrl-row:last-child{margin-bottom:0}
  .pt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .ctrl-row label{font-size:12px;color:var(--text2);min-width:20px;flex-shrink:0}
  input[type=range]{flex:1;accent-color:var(--text);cursor:pointer}
  .ctrl-val{
    font-size:13px;font-weight:500;color:var(--text);
    width:46px;text-align:right;flex-shrink:0;font-family:var(--mono);
  }

  .calc-box{
    border:0.5px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:10px;
    transition:background .3s,border-color .3s;
  }
  .calc-box.converged{
    background:rgba(29,158,117,0.1);
    border-color:rgba(29,158,117,0.5);
  }
  .calc-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:4px 0;border-bottom:0.5px solid var(--border);font-size:12px;
  }
  .calc-row:last-child{border-bottom:none}
  .calc-lbl{color:var(--text2);font-family:var(--mono)}
  .calc-val{
    font-weight:500;font-family:var(--mono);
    color:var(--text);font-size:13px;transition:color .3s;
  }
  .calc-box.converged .calc-val{color:#0f6e56}

  .zoom-wrap{
    border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;
  }
  .zoom-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 10px;background:var(--bg2);
    border-bottom:0.5px solid var(--border);
  }
  .zoom-title{
    font-size:10px;color:var(--text2);
    text-transform:uppercase;letter-spacing:.07em;
  }
  .zoom-ctrl{display:flex;align-items:center;gap:6px}
  .zoom-ctrl span{font-size:11px;color:var(--text2)}
  .zoom-btn{
    width:26px;height:26px;
    border:0.5px solid var(--border2);border-radius:var(--radius);
    background:var(--bg);color:var(--text);
    font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:1;font-family:var(--sans);
    transition:background .12s;
  }
  .zoom-btn:hover{background:var(--bg2)}
  canvas.zoom{display:block;width:100%}

  footer{
    margin-top:32px;padding-top:14px;
    border-top:0.5px solid var(--border);
    font-size:11px;color:var(--text3);text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="curve-row" id="curve-btns">
    <button class="cbtn active" data-c="0">t²</button>
    <button class="cbtn" data-c="1">5t²</button>
    <button class="cbtn" data-c="2">sin t</button>
    <button class="cbtn" data-c="3">t³−3t</button>
  </div>

  <div class="cvs-wrap">
    <canvas class="main" id="mc" height="230"
      role="img" aria-label="Distance-time graph with secant and tangent lines"></canvas>
  </div>

  <div class="ctrl-block">
    <div class="ctrl-row">
      <div class="pt-dot" style="background:#185FA5"></div>
      <label>P₁</label>
      <input type="range" id="p1-sl" min="0" max="10" value="3" step="1">
      <div class="ctrl-val" id="p1-val">—</div>
    </div>
    <div class="ctrl-row">
      <div class="pt-dot" style="background:#E24B4A"></div>
      <label>P₂</label>
      <input type="range" id="p2-sl" min="0" max="10" value="7" step="1">
      <div class="ctrl-val" id="p2-val">—</div>
    </div>
  </div>

  <div class="calc-box" id="calc-box">
    <div class="calc-row">
      <span class="calc-lbl">Δt = t₂ − t₁</span>
      <span class="calc-val" id="cv-dt">—</span>
    </div>
    <div class="calc-row">
      <span class="calc-lbl">Δd = d(t₂) − d(t₁)</span>
      <span class="calc-val" id="cv-dd">—</span>
    </div>
    <div class="calc-row">
      <span class="calc-lbl">Avg v = Δd / Δt</span>
      <span class="calc-val" id="cv-avg">—</span>
    </div>
    <div class="calc-row">
      <span class="calc-lbl" id="cv-deq-lbl">Inst v = d′(t₂)</span>
      <span class="calc-val" id="cv-inst">—</span>
    </div>
  </div>

  <div class="zoom-wrap">
    <div class="zoom-head">
      <span class="zoom-title">Zoomed in near P₂</span>
      <div class="zoom-ctrl">
        <button class="zoom-btn" id="z-out" aria-label="Zoom out">−</button>
        <span id="z-level">×4</span>
        <button class="zoom-btn" id="z-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <canvas class="zoom" id="zc" height="110"
      role="img" aria-label="Zoomed view near P2 showing secant rotating toward tangent"></canvas>
  </div>

  <footer>Instantaneous Velocity · Kinematics · Made with Claude</footer>
</div>

<script>
const STEPS=11;
const CURVES=[
  {fn:t=>t*t,         deriv:t=>2*t,         tMin:0,tMax:3,   dMin:-0.5,dMax:10,  deq:"d′(t)=2t"},
  {fn:t=>5*t*t,       deriv:t=>10*t,        tMin:0,tMax:3,   dMin:-0.5,dMax:46,  deq:"d′(t)=10t"},
  {fn:t=>Math.sin(t), deriv:t=>Math.cos(t), tMin:0,tMax:6.28,dMin:-1.3,dMax:1.3, deq:"d′(t)=cos(t)"},
  {fn:t=>t*t*t-3*t,   deriv:t=>3*t*t-3,    tMin:0,tMax:3,   dMin:-3,  dMax:19,  deq:"d′(t)=3t²−3"},
];

const W=420,H=230,ZW=420,ZH=110;
const PL=42,PR=12,PT=14,PB=28;

const mc=document.getElementById('mc');
const mctx=mc.getContext('2d');
mc.width=W; mc.height=H;
const zc=document.getElementById('zc');
const zctx=zc.getContext('2d');
zc.width=ZW; zc.height=ZH;

let cIdx=0, p1Step=3, p2Step=7;
const zoomLevels=[0.6,0.4,0.25,0.15,0.08,0.04,0.02];
let zoomIdx=2;

function C(){return CURVES[cIdx];}
function tAt(s){let c=C();return c.tMin+(c.tMax-c.tMin)*s/(STEPS-1);}
function isDark(){return window.matchMedia('(prefers-color-scheme:dark)').matches;}
function cxf(t){let c=C();return PL+(t-c.tMin)/(c.tMax-c.tMin)*(W-PL-PR);}
function cyf(d){let c=C();return H-PB-(d-c.dMin)/(c.dMax-c.dMin)*(H-PT-PB);}

function drawMain(){
  const dark=isDark();
  const c=C();
  mctx.clearRect(0,0,W,H);
  mctx.fillStyle=dark?'#1a1a1a':'#ffffff';
  mctx.fillRect(0,0,W,H);

  const gridC=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';
  const lblC=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const axC=dark?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.45)';

  mctx.setLineDash([2,4]); mctx.lineWidth=0.5; mctx.strokeStyle=gridC;
  for(let i=0;i<STEPS;i++){
    let t=tAt(i),x=cxf(t);
    mctx.beginPath();mctx.moveTo(x,PT);mctx.lineTo(x,H-PB);mctx.stroke();
    if(i%2===0){
      mctx.fillStyle=lblC;mctx.font='9px monospace';
      mctx.textAlign='center';mctx.fillText(t.toFixed(1),x,H-PB+12);
    }
  }
  for(let i=0;i<=4;i++){
    let d=c.dMin+(c.dMax-c.dMin)*i/4,y=cyf(d);
    mctx.beginPath();mctx.moveTo(PL,y);mctx.lineTo(W-PR,y);mctx.stroke();
    mctx.fillStyle=lblC;mctx.font='9px monospace';
    mctx.textAlign='right';mctx.fillText(d.toFixed(1),PL-3,y+3);
  }
  mctx.setLineDash([]);

  mctx.strokeStyle=axC;mctx.lineWidth=1;
  mctx.beginPath();mctx.moveTo(PL,PT);mctx.lineTo(PL,H-PB);mctx.lineTo(W-PR,H-PB);mctx.stroke();
  mctx.fillStyle=lblC;mctx.font='9px sans-serif';
  mctx.textAlign='center';mctx.fillText('t (s)',PL+(W-PL-PR)/2,H-1);
  mctx.save();mctx.translate(10,PT+(H-PT-PB)/2);mctx.rotate(-Math.PI/2);
  mctx.fillText('d (m)',0,0);mctx.restore();

  mctx.beginPath();
  mctx.strokeStyle=dark?'rgba(55,138,221,0.9)':'rgba(24,95,165,0.85)';
  mctx.lineWidth=2.5;
  for(let i=0;i<=300;i++){
    let t=c.tMin+(c.tMax-c.tMin)*i/300,d=c.fn(t);
    i===0?mctx.moveTo(cxf(t),cyf(d)):mctx.lineTo(cxf(t),cyf(d));
  }
  mctx.stroke();

  let t1=tAt(p1Step),t2=tAt(p2Step);
  let d1=c.fn(t1),d2=c.fn(t2);
  let x1=cxf(t1),y1=cyf(d1),x2=cxf(t2),y2=cyf(d2);
  let dt=t2-t1,dd=d2-d1;
  let isClose=p1Step===p2Step;
  let instV=c.deriv(t2);
  let slope=isClose?instV:(Math.abs(dt)<1e-9?instV:dd/dt);

  let extCol=isClose?'rgba(29,158,117,0.9)':'rgba(229,75,74,0.85)';
  let dLeft=d1+slope*(c.tMin-t1);
  let dRight=d1+slope*(c.tMax-t1);
  mctx.strokeStyle=extCol;mctx.lineWidth=1.8;
  mctx.setLineDash(isClose?[]:[6,4]);
  mctx.beginPath();mctx.moveTo(cxf(c.tMin),cyf(dLeft));mctx.lineTo(cxf(c.tMax),cyf(dRight));mctx.stroke();
  mctx.setLineDash([]);

  if(!isClose){
    let bx=x2,by=y1;
    mctx.strokeStyle=dark?'rgba(255,255,255,0.55)':'rgba(0,0,0,0.55)';
    mctx.lineWidth=1.5;
    mctx.beginPath();mctx.moveTo(x1,y1);mctx.lineTo(bx,y1);mctx.stroke();
    mctx.beginPath();mctx.moveTo(bx,y1);mctx.lineTo(bx,y2);mctx.stroke();
    let sq=5;
    mctx.beginPath();
    mctx.moveTo(bx-sq,y1);
    mctx.lineTo(bx-sq,y1+(y2>y1?sq:-sq));
    mctx.lineTo(bx,y1+(y2>y1?sq:-sq));
    mctx.stroke();
    mctx.font='bold 11px monospace';
    mctx.fillStyle=dark?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.85)';
    mctx.textAlign='center';
    mctx.fillText('Δt='+dt.toFixed(2)+' s',(x1+bx)/2,y1+(y2>y1?-13:14));
    let ddLabelX=bx+(bx>W/2?-4:6);
    mctx.font='bold 11px monospace';
    mctx.fillStyle=dark?'rgba(255,255,255,0.85)':'rgba(0,0,0,0.85)';
    mctx.textAlign=bx>W/2?'right':'left';
    mctx.fillText('Δd='+dd.toFixed(2),ddLabelX,(y1+y2)/2+4);
  }

  mctx.beginPath();mctx.arc(x1,y1,6,0,Math.PI*2);
  mctx.fillStyle='#185FA5';mctx.fill();
  mctx.strokeStyle='#fff';mctx.lineWidth=1.5;mctx.stroke();
  mctx.fillStyle=dark?'#fff':'#111';
  mctx.font='bold 10px monospace';mctx.textAlign='left';
  mctx.fillText('P₁',x1+8,y1+(y1>H*0.6?-7:12));

  mctx.beginPath();mctx.arc(x2,y2,6,0,Math.PI*2);
  mctx.fillStyle=isClose?'#1D9E75':'#E24B4A';mctx.fill();
  mctx.strokeStyle='#fff';mctx.lineWidth=1.5;mctx.stroke();
  mctx.fillStyle=dark?'#fff':'#111';
  mctx.font='bold 10px monospace';
  mctx.textAlign=x2>x1?'left':'right';
  mctx.fillText(isClose?'P₁=P₂':'P₂',x2+(x2>x1?8:-8),y2+(y2>H*0.6?-7:12));

  updateCalc(t1,t2,d1,d2,dt,dd,slope,instV,isClose);
  drawZoom(t1,t2,d1,d2,c,dark,isClose,instV);
}

function drawZoom(t1,t2,d1,d2,c,dark,isClose,instV){
  zctx.clearRect(0,0,ZW,ZH);
  zctx.fillStyle=dark?'#1a1a1a':'#ffffff';
  zctx.fillRect(0,0,ZW,ZH);

  const SPAN=zoomLevels[zoomIdx]*(c.tMax-c.tMin);
  let tL=Math.max(c.tMin,t2-SPAN);
  let tR=Math.min(c.tMax,t2+SPAN);
  if(tR-tL<1e-6)return;

  let samples=[];
  for(let i=0;i<=80;i++)samples.push(c.fn(tL+(tR-tL)*i/80));
  let dLo=Math.min(...samples),dHi=Math.max(...samples);
  let pad=(dHi-dLo)*0.18||0.05;
  dLo-=pad;dHi+=pad;

  const ZPL=28,ZPR=10,ZPT=8,ZPB=20;
  function zx(t){return ZPL+(t-tL)/(tR-tL)*(ZW-ZPL-ZPR);}
  function zy(d){return ZH-ZPB-(d-dLo)/(dHi-dLo)*(ZH-ZPT-ZPB);}

  const gridC=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';
  const lblC=dark?'rgba(255,255,255,0.32)':'rgba(0,0,0,0.32)';
  zctx.strokeStyle=gridC;zctx.lineWidth=0.5;zctx.setLineDash([2,3]);
  for(let i=0;i<=4;i++){
    let t=tL+(tR-tL)*i/4;
    zctx.beginPath();zctx.moveTo(zx(t),ZPT);zctx.lineTo(zx(t),ZH-ZPB);zctx.stroke();
    zctx.fillStyle=lblC;zctx.font='8px monospace';zctx.textAlign='center';
    zctx.fillText(t.toFixed(3),zx(t),ZH-ZPB+11);
  }
  zctx.setLineDash([]);

  zctx.beginPath();
  zctx.strokeStyle=dark?'rgba(55,138,221,0.9)':'rgba(24,95,165,0.9)';
  zctx.lineWidth=2;
  for(let i=0;i<=200;i++){
    let t=tL+(tR-tL)*i/200,d=c.fn(t);
    i===0?zctx.moveTo(zx(t),zy(d)):zctx.lineTo(zx(t),zy(d));
  }
  zctx.stroke();

  let dyL=d2+instV*(tL-t2),dyR=d2+instV*(tR-t2);
  zctx.strokeStyle='rgba(29,158,117,0.85)';zctx.lineWidth=1.5;
  zctx.beginPath();zctx.moveTo(zx(tL),zy(dyL));zctx.lineTo(zx(tR),zy(dyR));zctx.stroke();

  if(!isClose){
    let dt=t2-t1,dd=d2-d1;
    if(Math.abs(dt)>1e-9){
      let slope=dd/dt;
      let sL=d2+slope*(tL-t2),sR=d2+slope*(tR-t2);
      zctx.strokeStyle='rgba(229,75,74,0.7)';zctx.lineWidth=1.2;zctx.setLineDash([5,3]);
      zctx.beginPath();zctx.moveTo(zx(tL),zy(sL));zctx.lineTo(zx(tR),zy(sR));zctx.stroke();
      zctx.setLineDash([]);
    }
    if(t1>=tL&&t1<=tR){
      zctx.beginPath();zctx.arc(zx(t1),zy(d1),4,0,Math.PI*2);
      zctx.fillStyle='#185FA5';zctx.fill();
      zctx.strokeStyle='#fff';zctx.lineWidth=1;zctx.stroke();
      zctx.fillStyle=dark?'rgba(255,255,255,0.7)':'rgba(0,0,0,0.6)';
      zctx.font='bold 8px monospace';zctx.textAlign='left';
      zctx.fillText('P₁',zx(t1)+5,zy(d1)-4);
    }
  }

  zctx.beginPath();zctx.arc(zx(t2),zy(d2),5,0,Math.PI*2);
  zctx.fillStyle=isClose?'#1D9E75':'#E24B4A';zctx.fill();
  zctx.strokeStyle='#fff';zctx.lineWidth=1.5;zctx.stroke();
  zctx.fillStyle=dark?'rgba(255,255,255,0.7)':'rgba(0,0,0,0.6)';
  zctx.font='bold 8px monospace';zctx.textAlign='left';
  zctx.fillText(isClose?'P₁=P₂':'P₂',zx(t2)+6,zy(d2)-4);
}

function fmt(v,dp){return v.toFixed(dp??3);}

function updateCalc(t1,t2,d1,d2,dt,dd,slope,instV,isClose){
  let box=document.getElementById('calc-box');
  box.classList.toggle('converged',isClose);
  let dtStr=isClose?'0 s':(dt>=0?'+':'')+fmt(dt,2)+' s';
  let ddStr=isClose?'0 m':(dd>=0?'+':'')+fmt(dd,3)+' m';
  let avgStr=isClose?fmt(instV,3)+' m/s':fmt(slope,3)+' m/s';
  let instStr=fmt(instV,3)+' m/s';
  document.getElementById('cv-dt').textContent=dtStr;
  document.getElementById('cv-dd').textContent=ddStr;
  document.getElementById('cv-avg').textContent=isClose?'= Inst v = '+avgStr:avgStr;
  document.getElementById('cv-inst').textContent=instStr;
  document.getElementById('cv-deq-lbl').textContent='Inst v = '+C().deq+' at t₂';
}

function updateZoomLabel(){
  let lvl=zoomLevels[zoomIdx];
  let label=lvl>=0.4?'×1':lvl>=0.2?'×2':lvl>=0.1?'×4':lvl>=0.05?'×8':lvl>=0.025?'×16':'×32';
  document.getElementById('z-level').textContent=label;
}

document.getElementById('p1-sl').addEventListener('input',e=>{
  p1Step=parseInt(e.target.value);
  document.getElementById('p1-val').textContent='t='+tAt(p1Step).toFixed(2);
  drawMain();
});
document.getElementById('p2-sl').addEventListener('input',e=>{
  p2Step=parseInt(e.target.value);
  document.getElementById('p2-val').textContent='t='+tAt(p2Step).toFixed(2);
  drawMain();
});
document.getElementById('z-in').addEventListener('click',()=>{
  if(zoomIdx<zoomLevels.length-1){zoomIdx++;updateZoomLabel();drawMain();}
});
document.getElementById('z-out').addEventListener('click',()=>{
  if(zoomIdx>0){zoomIdx--;updateZoomLabel();drawMain();}
});
document.getElementById('curve-btns').addEventListener('click',e=>{
  let b=e.target.closest('.cbtn');if(!b)return;
  document.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  cIdx=parseInt(b.dataset.c);
  p1Step=3;p2Step=7;zoomIdx=2;
  document.getElementById('p1-sl').value=3;
  document.getElementById('p2-sl').value=7;
  updateZoomLabel();
  document.getElementById('p1-val').textContent='t='+tAt(3).toFixed(2);
  document.getElementById('p2-val').textContent='t='+tAt(7).toFixed(2);
  drawMain();
});

window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',drawMain);

updateZoomLabel();
document.getElementById('p1-val').textContent='t='+tAt(p1Step).toFixed(2);
document.getElementById('p2-val').textContent='t='+tAt(p2Step).toFixed(2);
drawMain();
</script>
</body>
</html>
