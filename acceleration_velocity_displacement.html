<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceleration, Velocity & Displacement — Interactive Visualization</title>
<style>
  :root {
    --bg:#ffffff; --bg2:#f5f5f3; --bg3:#ebebeb;
    --text:#1a1a18; --text2:#5f5e5a; --text3:#888780;
    --border:rgba(0,0,0,0.13); --border2:rgba(0,0,0,0.25);
    --radius:8px; --radius-lg:12px;
    --mono:'Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1a1a1a; --bg2:#252525; --bg3:#303030;
      --text:#f0f0ee; --text2:#a0a09a; --text3:#666660;
      --border:rgba(255,255,255,0.13); --border2:rgba(255,255,255,0.25);
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg);color:var(--text);
    font-family:var(--sans);min-height:100vh;
    display:flex;justify-content:center;
    padding:20px 12px 40px;
  }
  .wrap{width:100%;max-width:420px}

  .preset-row{display:flex;gap:5px;margin-bottom:10px}
  .pbtn{
    flex:1;padding:8px 2px;font-size:12px;font-weight:500;
    border:0.5px solid var(--border2);border-radius:var(--radius);
    background:var(--bg);color:var(--text2);
    cursor:pointer;text-align:center;font-family:var(--mono);
    transition:background .12s,color .12s;
  }
  .pbtn:hover{background:var(--bg2)}
  .pbtn.active{background:#BA7517;color:#fff;border-color:#BA7517;box-shadow:0 0 0 2px rgba(186,117,23,0.25)}

  .graphs{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
  .graph-block{display:flex;flex-direction:column;margin-bottom:12px}
  .graph-block:last-child{margin-bottom:0}
  .graph-wrap{position:relative}
  canvas.graph{
    display:block;width:100%;
    border-radius:var(--radius) var(--radius) 0 0;
    border:0.5px solid var(--border);
    border-bottom:none;
  }
  .area-tag{
    display:flex;align-items:center;justify-content:center;
    padding:4px 12px;
    font-size:12px;font-weight:700;font-family:var(--mono);
    border-radius:0 0 var(--radius) var(--radius);
    border:0.5px solid var(--border);border-top:none;
    min-height:24px;
  }
  .area-tag.v-tag{background:rgba(24,95,165,0.15);color:#185FA5}
  .area-tag.x-tag{background:rgba(15,110,86,0.15);color:#1D9E75}
  .graph-block-last canvas.graph{
    border-radius:var(--radius);
    border-bottom:0.5px solid var(--border);
  }

  .scrub-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 2px}
  .scrub-row label{font-size:12px;color:var(--text2);flex-shrink:0}
  input[type=range]#scrub{
    flex:1;-webkit-appearance:none;appearance:none;
    height:36px;background:transparent;outline:none;cursor:pointer;padding:0;margin:0;
  }
  input[type=range]#scrub::-webkit-slider-runnable-track{height:36px;border-radius:18px;background:#BA7517}
  input[type=range]#scrub::-moz-range-track{height:36px;border-radius:18px;background:#BA7517}
  input[type=range]#scrub::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:24px;height:24px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 1px 4px rgba(0,0,0,0.3);
    margin-top:6px;cursor:pointer;
  }
  input[type=range]#scrub::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:pointer;
  }

  .eq-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .eq{
    background:var(--bg2);border-radius:var(--radius);
    padding:9px 10px;border-left:3px solid;line-height:1.7;
  }
  .eq .ef{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text);display:block}
  .eq .es{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--text2);display:block;margin-top:2px}

  footer{
    margin-top:32px;padding-top:14px;
    border-top:0.5px solid var(--border);
    font-size:11px;color:var(--text3);text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="preset-row" id="preset-row">
    <button class="pbtn active" data-p="0">a=0</button>
    <button class="pbtn" data-p="1">a=c</button>
    <button class="pbtn" data-p="2">a=t</button>
    <button class="pbtn" data-p="3">a=t²</button>
    <button class="pbtn" data-p="4">a=sin t</button>
  </div>

  <div class="graphs">
    <div class="graph-block">
      <div class="graph-wrap">
        <canvas class="graph" id="ga" height="84"
          role="img" aria-label="Acceleration vs time graph"></canvas>
      </div>
      <div class="area-tag v-tag" id="tag-a">Δv = ∫a dt = 0.000</div>
    </div>
    <div class="graph-block">
      <div class="graph-wrap">
        <canvas class="graph" id="gv" height="84"
          role="img" aria-label="Velocity vs time graph"></canvas>
      </div>
      <div class="area-tag x-tag" id="tag-v">Δx = ∫v dt = 0.000</div>
    </div>
    <div class="graph-block graph-block-last">
      <div class="graph-wrap">
        <canvas class="graph" id="gx" height="84"
          role="img" aria-label="Displacement vs time graph"></canvas>
      </div>
    </div>
  </div>

  <div class="scrub-row">
    <label>t</label>
    <input type="range" id="scrub" min="0" max="100" value="100" step="1">
    <span style="font-size:12px;font-family:'Courier New',monospace;color:var(--text2);min-width:42px;text-align:right" id="t-disp">t=6.28</span>
  </div>

  <div class="eq-row">
    <div class="eq" style="border-color:#BA7517">
      <span class="ef" id="eq-a">a(t) = 0</span>
      <span class="es">Δv = ∫a dt</span>
    </div>
    <div class="eq" style="border-color:#185FA5">
      <span class="ef" id="eq-v">v(t) = v₀</span>
      <span class="es">Δx = ∫v dt</span>
    </div>
    <div class="eq" style="border-color:#1D9E75">
      <span class="ef" id="eq-x">x(t) = v₀t</span>
      <span class="es">&nbsp;</span>
    </div>
  </div>

  <footer>Acceleration · Velocity · Displacement · Kinematics · Made with Claude</footer>
</div>

<script>
const W=420, GH=84;
const PL=36, PR=8, PT=10, PB=16;
const N=600, T_MAX=2*Math.PI;

const PRESETS=[
  {a:t=>0,          v:t=>1,               x:t=>t,
   aR:[-2,2],       vR:[-0.2,2],          xR:[-0.3,7],
   eqA:'a(t) = 0',  eqV:'v(t) = v₀',     eqX:'x(t) = v₀·t'},
  {a:t=>1,          v:t=>t,               x:t=>0.5*t*t,
   aR:[-0.3,2],     vR:[-0.5,7],          xR:[-0.5,22],
   eqA:'a(t) = c',  eqV:'v(t) = c·t',    eqX:'x(t) = ½c·t²'},
  {a:t=>t,          v:t=>0.5*t*t,         x:t=>(1/6)*t*t*t,
   aR:[-0.5,7],     vR:[-0.5,22],         xR:[-0.5,50],
   eqA:'a(t) = t',  eqV:'v(t) = ½t²',    eqX:'x(t) = ⅙t³'},
  {a:t=>t*t,        v:t=>(1/3)*t*t*t,     x:t=>(1/12)*Math.pow(t,4),
   aR:[-0.5,42],    vR:[-1,92],           xR:[-1,160],
   eqA:'a(t) = t²', eqV:'v(t) = ⅓t³',   eqX:'x(t) = ¹⁄₁₂t⁴'},
  {a:t=>Math.sin(t),v:t=>1-Math.cos(t),   x:t=>t-Math.sin(t),
   aR:[-1.5,1.5],   vR:[-0.2,2.3],        xR:[-0.5,7],
   eqA:'a(t)=sin t',eqV:'v=1−cos t',      eqX:'x=t−sin t'},
];

const CFG=[
  {id:'ga', line:'#BA7517', dimLine:'rgba(186,117,23,0.2)',  rKey:'aR', fn:'a', label:'a(t)', hasArea:true,  areaFill:'rgba(24,95,165,0.22)'},
  {id:'gv', line:'#185FA5', dimLine:'rgba(24,95,165,0.2)',   rKey:'vR', fn:'v', label:'v(t)', hasArea:true,  areaFill:'rgba(15,110,86,0.22)'},
  {id:'gx', line:'#1D9E75', dimLine:'rgba(29,158,117,0.2)',  rKey:'xR', fn:'x', label:'x(t)', hasArea:false, areaFill:null},
];

let pIdx=0, scrubPct=1;

CFG.forEach(c=>{
  const cv=document.getElementById(c.id);
  cv.width=W; cv.height=GH;
  c.cv=cv; c.ctx=cv.getContext('2d');
});

function isDark(){return window.matchMedia('(prefers-color-scheme:dark)').matches;}

function integrate(fn, tStop){
  if(tStop<=0) return 0;
  const steps=400, dt=tStop/steps;
  let sum=0;
  for(let i=0;i<steps;i++){
    const t0=i*dt, t1=(i+1)*dt;
    sum+=0.5*(fn(t0)+fn(t1))*dt;
  }
  return sum;
}

function drawGraph(c, p, tCursor){
  const ctx=c.ctx;
  const [rMin,rMax]=p[c.rKey];
  const fn=p[c.fn];
  const dark=isDark();
  const gw=W-PL-PR, gh=GH-PT-PB;
  const tStop=tCursor*T_MAX;

  ctx.clearRect(0,0,W,GH);
  ctx.fillStyle=dark?'#1a1a1a':'#ffffff';
  ctx.fillRect(0,0,W,GH);

  const cx=t=>PL+(t/T_MAX)*gw;
  const cy=v=>PT+gh-(Math.max(rMin,Math.min(rMax,v))-rMin)/(rMax-rMin)*gh;

  const y0=cy(0);
  const lblCol=dark?'rgba(255,255,255,0.28)':'rgba(0,0,0,0.28)';

  /* zero line */
  if(y0>=PT&&y0<=PT+gh){
    ctx.strokeStyle=dark?'rgba(255,255,255,0.09)':'rgba(0,0,0,0.09)';
    ctx.lineWidth=0.5; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PL,y0); ctx.lineTo(W-PR,y0); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* y labels */
  ctx.fillStyle=lblCol; ctx.font='9px monospace'; ctx.textAlign='right';
  [rMin,0,rMax].forEach(v=>{
    if(v>=rMin&&v<=rMax)
      ctx.fillText(Math.abs(v)>=10?v.toFixed(0):v.toFixed(1), PL-3, cy(v)+3);
  });

  /* t labels */
  ctx.fillStyle=lblCol; ctx.textAlign='center';
  [{t:0,l:'0'},{t:T_MAX/2,l:'π'},{t:T_MAX,l:'2π'}].forEach(({t,l})=>ctx.fillText(l,cx(t),GH-2));

  /* area fill */
  if(c.hasArea&&tStop>0){
    const baseY=y0>=PT&&y0<=PT+gh?y0:PT+gh;
    ctx.beginPath();
    ctx.moveTo(cx(0),baseY);
    ctx.lineTo(cx(0),cy(fn(0)));
    for(let i=1;i<=N;i++){
      const t=T_MAX*i/N; if(t>tStop) break;
      ctx.lineTo(cx(t),cy(fn(t)));
    }
    ctx.lineTo(cx(Math.min(tStop,T_MAX)),baseY);
    ctx.closePath();
    ctx.fillStyle=c.areaFill; ctx.fill();
  }

  /* dim full curve */
  ctx.beginPath(); ctx.strokeStyle=c.dimLine; ctx.lineWidth=1.5;
  for(let i=0;i<=N;i++){
    const t=T_MAX*i/N;
    i===0?ctx.moveTo(cx(t),cy(fn(t))):ctx.lineTo(cx(t),cy(fn(t)));
  }
  ctx.stroke();

  /* active curve */
  ctx.beginPath(); ctx.strokeStyle=c.line; ctx.lineWidth=2.2;
  let started=false;
  for(let i=0;i<=N;i++){
    const t=T_MAX*i/N; if(t>tStop) break;
    started?ctx.lineTo(cx(t),cy(fn(t))):ctx.moveTo(cx(t),cy(fn(t)));
    started=true;
  }
  ctx.stroke();

  /* axes */
  ctx.strokeStyle=lblCol; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(PL,PT); ctx.lineTo(PL,PT+gh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PL,PT+gh); ctx.lineTo(W-PR,PT+gh); ctx.stroke();

  /* cursor line */
  const curX=cx(tStop);
  ctx.strokeStyle=c.line; ctx.lineWidth=0.8; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(curX,PT); ctx.lineTo(curX,PT+gh); ctx.stroke();
  ctx.setLineDash([]);

  /* cursor dot */
  const curVal=fn(tStop);
  const dotX=curX, dotY=cy(curVal);
  ctx.beginPath(); ctx.arc(dotX,dotY,4.5,0,Math.PI*2);
  ctx.fillStyle=c.line; ctx.fill();
  ctx.strokeStyle=dark?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.95)';
  ctx.lineWidth=1.4; ctx.stroke();

  /* floating value pill */
  const labelTxt=c.label.replace('(t)','')+' = '+curVal.toFixed(2);
  ctx.font='bold 11px monospace';
  const tw=ctx.measureText(labelTxt).width;
  let lx=dotX+8, ly=dotY-6;
  if(lx+tw+8>W-PR) lx=dotX-tw-12;
  if(ly<PT+10) ly=dotY+16;
  const pp=4;
  ctx.fillStyle=dark?'rgba(25,25,25,0.88)':'rgba(255,255,255,0.93)';
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(lx-pp,ly-11,tw+pp*2,15,3);ctx.fill();}
  else ctx.fillRect(lx-pp,ly-11,tw+pp*2,15);
  ctx.fillStyle=c.line;
  ctx.fillText(labelTxt,lx,ly);

  /* graph label */
  ctx.font='bold 11px monospace'; ctx.fillStyle=c.line; ctx.textAlign='left';
  ctx.fillText(c.label, PL+4, PT+12);
}

function render(){
  const p=PRESETS[pIdx];
  const tNow=scrubPct*T_MAX;
  CFG.forEach(c=>drawGraph(c,p,scrubPct));
  document.getElementById('tag-a').textContent='Δv = ∫a dt = '+integrate(p.a,tNow).toFixed(3);
  document.getElementById('tag-v').textContent='Δx = ∫v dt = '+integrate(p.v,tNow).toFixed(3);
  document.getElementById('t-disp').textContent='t='+tNow.toFixed(2);
  document.getElementById('eq-a').textContent=p.eqA;
  document.getElementById('eq-v').textContent=p.eqV;
  document.getElementById('eq-x').textContent=p.eqX;
}

document.getElementById('preset-row').addEventListener('click',e=>{
  const b=e.target.closest('.pbtn'); if(!b) return;
  document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  pIdx=parseInt(b.dataset.p); render();
});
document.getElementById('scrub').addEventListener('input',e=>{
  scrubPct=parseInt(e.target.value)/100; render();
});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
render();
</script>
</body>
</html>
