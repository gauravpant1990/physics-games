<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Lurch is Inertia</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;--gold:#ffcf33;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 11px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:.2px}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;flex-direction:column;gap:8px}
  .fpanel{display:flex;gap:8px;justify-content:center}
  .fbtn{flex:1;font-family:inherit;font-size:12.5px;font-weight:800;padding:8px 0;border-radius:9px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  .fbtn.on{background:var(--navy);color:var(--gold)}
  .btns{display:flex;gap:8px}
  button.act{flex:1;font-family:inherit;font-size:14px;font-weight:800;padding:10px 0;border-radius:9px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  #play{background:#2fa84f;border-color:#1d7a37;color:#fff;box-shadow:0 2px 0 #1d7a37}
  #brake{background:#E24B4A;border-color:#a83232;color:#fff;box-shadow:0 2px 0 #a83232;display:none}
  #retry{display:none}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">The Lurch is Inertia, Not a Push</div>
    <div class="sub">The metro pulls away and you fall back. From the ground, friction drags your feet while your torso keeps its motion. Switch to the train frame to see the pseudo force.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl">
      <div class="fpanel" id="fbtns">
        <button class="fbtn on" data-f="train">Inside the train</button>
        <button class="fbtn" data-f="ground">From the ground</button>
      </div>
      <div class="btns">
        <button class="act" id="play">&#9654; Play</button>
        <button class="act" id="brake">Brake</button>
        <button class="act" id="retry">&#8635; Retry</button>
      </div>
    </div>
  </div>
  <div class="foot">Laws of Motion &middot; Pseudo Force &middot; The Lurch</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const playB=document.getElementById('play'),brakeB=document.getElementById('brake'),retryB=document.getElementById('retry');
const fbtns=document.getElementById('fbtns');
let W=360,H=403;const ASPECT=1.12;
let phase='rest', frame='train', v=0, ang=0, wheel=0, scroll=0, last=0;
const Vmax=0.13, A=0.13, B=0.26, LEAN=0.50;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}

function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(tx,x,y,col,al,sz){sx.font='800 '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.2;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(tx,x,y);sx.fillStyle=col;sx.fillText(tx,x,y);}
function rrect(x,y,w,h,r){sx.beginPath();sx.roundRect(x,y,w,h,r);}

function person(hx,floorY,a,s,ghost){
  const tw=W*0.052*s, th=H*0.115*s, headR=H*0.028*s, legW=W*0.034*s, hipY=floorY-H*0.052*s;
  if(ghost){sx.globalAlpha=0.16;}
  rrect(hx-legW/2,hipY,legW,floorY-hipY,3);sx.fillStyle=ghost?'#9aa3b8':'#cdd6ea';sx.fill();
  if(!ghost){sx.lineWidth=1.8;sx.strokeStyle='#1b2348';sx.stroke();}
  rrect(hx-W*0.05*s,floorY-2,W*0.10*s,H*0.016*s,2);sx.fillStyle=ghost?'#9aa3b8':'#1b2348';sx.fill();
  sx.save();sx.translate(hx,hipY);sx.rotate(a);
  rrect(-tw/2,-th,tw,th,5);sx.fillStyle=ghost?'#9aa3b8':'#d3def0';sx.fill();
  if(!ghost){sx.lineWidth=1.8;sx.strokeStyle='#1b2348';sx.stroke();}
  sx.beginPath();sx.arc(0,-th-headR*0.7,headR,0,7);sx.fillStyle=ghost?'#9aa3b8':'#f0d8c0';sx.fill();
  if(!ghost){sx.lineWidth=1.8;sx.strokeStyle='#1b2348';sx.stroke();}
  sx.restore();sx.globalAlpha=1;
  return {hipY, torsoTop:hipY-th};
}

function setPhase(p){phase=p;
  playB.style.display = p==='rest'?'block':'none';
  brakeB.style.display = (p==='accel'||p==='cruise')?'block':'none';
  retryB.style.display = (p==='braking'||p==='stopped')?'block':'none';}
function curAcc(){return phase==='accel'?A:(phase==='braking'?-B:0);}

function draw(){sx.clearRect(0,0,W,H);
  const ground = frame==='ground';
  const acc=curAcc(), dir=acc>0?1:(acc<0?-1:0);

  // ===== scene: small train, person leaning =====
  const railY=H*0.335, carW=W*0.32, carH=H*0.205;
  const span=W+carW;
  const groundLeft=-carW + (((scroll + carW + W*0.05) % span) + span) % span;
  const carLeft = ground ? groundLeft : (W-carW)/2;
  const carY1=railY-H*0.018, carY0=carY1-carH, floorY=carY1-H*0.012;
  sx.fillStyle='#eef3f6';sx.fillRect(0,0,W,railY);
  // rail + posts
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,railY);sx.lineTo(W,railY);sx.stroke();
  const PS=W*0.10, poff=ground?0:(scroll%PS);
  sx.strokeStyle='#b9b09a';sx.lineWidth=3;
  for(let i=-1;i<W/PS+2;i++){const px=i*PS-poff;sx.beginPath();sx.moveTo(px,railY+3);sx.lineTo(px,railY+H*0.02);sx.stroke();}
  // speed lines
  if(v>0.03){sx.strokeStyle='rgba(27,35,72,'+Math.min(0.4,v*0.8)+')';sx.lineWidth=2;
    for(let i=0;i<3;i++){const y=carY0+(0.3+i*0.2)*carH;const ln=W*0.03+v*W*0.10;
      const bx=carLeft-W*0.015-((scroll*2+i*23)%(W*0.13));sx.beginPath();sx.moveTo(bx,y);sx.lineTo(bx-ln,y);sx.stroke();}}
  // wheels
  for(const wf of [0.27,0.73]){const wx=carLeft+carW*wf;
    sx.beginPath();sx.arc(wx,carY1+H*0.011,H*0.015,0,7);sx.fillStyle='#1b2348';sx.fill();
    sx.save();sx.translate(wx,carY1+H*0.011);sx.rotate(wheel);sx.strokeStyle='#cdd6ea';sx.lineWidth=1.8;
    for(let k=0;k<4;k++){sx.rotate(Math.PI/2);sx.beginPath();sx.moveTo(0,0);sx.lineTo(0,H*0.011);sx.stroke();}
    sx.restore();}
  // car + window
  rrect(carLeft,carY0,carW,carH,11);sx.fillStyle='#eef1f7';sx.fill();sx.lineWidth=2.3;sx.strokeStyle='#1b2348';sx.stroke();
  const wx0=carLeft+carW*0.16,wy0=carY0+H*0.022,ww=carW*0.68,wh=H*0.05;
  sx.save();rrect(wx0,wy0,ww,wh,5);sx.clip();sx.fillStyle='#cfe6f2';sx.fillRect(wx0,wy0,ww,wh);
  sx.fillStyle='#9db8c8';const S=W*0.06,hh=[0.5,0.32,0.6,0.4];
  if(!ground){const first=Math.floor(scroll/S);for(let i=-1;i<ww/S+2;i++){const idx=first+i;const x=wx0+(i*S-(scroll-first*S));
    const h=hh[((idx%hh.length)+hh.length)%hh.length]*wh;sx.fillRect(x,wy0+wh-h,S*0.6,h);}}
  else{sx.fillRect(wx0+ww*0.2,wy0+wh*0.4,S*0.6,wh*0.6);sx.fillRect(wx0+ww*0.62,wy0+wh*0.3,S*0.6,wh*0.7);}
  sx.restore();rrect(wx0,wy0,ww,wh,5);sx.lineWidth=1.4;sx.strokeStyle='#1b2348';sx.stroke();
  sx.strokeStyle='#1b2348';sx.lineWidth=1.6;sx.beginPath();sx.moveTo(carLeft+5,floorY);sx.lineTo(carLeft+carW-5,floorY);sx.stroke();
  const hx=carLeft+carW*0.5;
  if(Math.abs(ang)>0.03) person(hx,floorY,0,0.66,true);
  person(hx,floorY,ang,0.66,false);

  // scene labels (kept minimal, away from the body)
  if(phase==='accel'){arrow(hx-W*0.07,carY0-H*0.022,W*0.14,0,'#185FA5',3);tag('speeding up',hx,carY0-H*0.05,'#185FA5','center',10);}
  else if(phase==='cruise'){tag('constant speed: no lurch',hx,carY0-H*0.035,'#1D9E75','center',10);}
  else if(phase==='braking'){arrow(hx+W*0.07,carY0-H*0.022,-W*0.14,0,'#185FA5',3);tag('braking',hx,carY0-H*0.05,'#185FA5','center',10);}
  tag(ground?'viewed from the ground':'viewed from inside',W*0.5,H*0.385,'#8a8f80','center',9.5);

  // ===== divider + steady free-body diagram of the passenger =====
  tag(ground?'WHAT ACTUALLY ACTS ON YOU':'FORCES IN THE TRAIN FRAME',W*0.5,H*0.44,'#1b2348','center',11.5);
  const fcx=W*0.5, fFloor=H*0.88;
  person(fcx,fFloor,0,1.0,false);
  const hipY=fFloor-H*0.052, torsoMid=hipY-H*0.06;
  if(dir!==0){
    // friction = the real horizontal force, on the feet (both frames)
    arrow(fcx+dir*W*0.05,fFloor-H*0.006,dir*W*0.15,0,'#2fa84f',4.2);
    tag('friction',fcx+dir*W*0.235,fFloor-H*0.006,'#2fa84f',dir>0?'left':'right',11);
    if(ground){
      tag('the only real push',fcx+dir*W*0.235,fFloor-H*0.006+H*0.028,'#2fa84f',dir>0?'left':'right',9.5);
      tag('no force here',fcx-dir*W*0.16,torsoMid,'#8a8f80',dir>0?'right':'left',10.5);
      tag('just inertia',fcx-dir*W*0.16,torsoMid+H*0.028,'#8a8f80',dir>0?'right':'left',10.5);
      tag('real force on the torso = 0',W*0.5,H*0.955,'#1b2348','center',11.5);
    }else{
      // pseudo force on the torso, opposite to the train's acceleration
      arrow(fcx-dir*W*0.05,torsoMid,-dir*W*0.16,0,'#7A4FA3',4.2);
      tag('pseudo force',fcx-dir*W*0.255,torsoMid,'#7A4FA3',dir>0?'right':'left',11);
      tag('= m a',fcx-dir*W*0.255,torsoMid+H*0.028,'#7A4FA3',dir>0?'right':'left',9.5);
      tag('inside the train, add a pseudo force opposite to a',W*0.5,H*0.955,'#7A4FA3','center',10.5);
    }
  }else{
    tag('no acceleration now',W*0.5,H*0.66,'#8a8f80','center',11);
    const note = phase==='cruise' ? 'moving at constant speed: no lurch'
              : phase==='stopped' ? 'the metro has stopped'
              : 'press Play to start the metro';
    tag(note,W*0.5,H*0.955,'#8a8f80','center',10.5);
  }
}

function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(phase==='accel'){v+=A*dt;if(v>=Vmax){v=Vmax;setPhase('cruise');}}
  else if(phase==='braking'){v-=B*dt;if(v<=0){v=0;setPhase('stopped');}}
  const acc=curAcc();
  const target = acc>0 ? -LEAN : (acc<0 ? LEAN*1.12 : 0);
  ang += (target-ang)*Math.min(1,dt*6);
  wheel += v*dt*24; scroll += v*dt*W;
  draw();requestAnimationFrame(loop);}

playB.addEventListener('click',()=>{v=0;scroll=0;wheel=0;setPhase('accel');});
brakeB.addEventListener('click',()=>{setPhase('braking');});
retryB.addEventListener('click',()=>{v=0;ang=0;scroll=0;setPhase('rest');});
fbtns.addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;frame=b.dataset.f;
  [...fbtns.children].forEach(c=>c.classList.toggle('on',c===b));draw();});
window.addEventListener('resize',fit);
setPhase('rest');fit();requestAnimationFrame(loop);
</script></body></html>
