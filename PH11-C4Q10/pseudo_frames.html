<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Two Frames, Same Lurch</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;--gold:#ffcf33;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 11px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:.2px}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .fpanel{display:flex;gap:8px;justify-content:center}
  .fbtn{flex:1;font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 0;border-radius:9px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  .fbtn.on{background:var(--navy);color:var(--gold)}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Two Frames, Same Lurch</div>
    <div class="sub">Same metro, fixed acceleration. From the ground it just drives off. Ride inside and it looks still, so you add a pseudo force to explain why.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="fpanel" id="fbtns">
      <button class="fbtn on" data-f="ground">Ground frame</button>
      <button class="fbtn" data-f="train">Train frame</button>
    </div>
  </div>
  <div class="foot">Laws of Motion &middot; Pseudo Force &middot; Frames</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const fbtns=document.getElementById('fbtns');
let W=360,H=300;const ASPECT=0.83;
const m=50, a=2;                      // fixed, constant acceleration
let frame='ground', x=0, v=0, last=0;
let A,xMax;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);
  A=W*0.40; xMax=W*1.25;}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<2&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(180,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}

function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(tx,x,y,col,al,sz){sx.font='800 '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3;sx.strokeStyle='rgba(255,255,255,.92)';sx.lineJoin='round';
  sx.strokeText(tx,x,y);sx.fillStyle=col;sx.fillText(tx,x,y);}
function rrect(x,y,w,h,r){sx.beginPath();sx.roundRect(x,y,w,h,r);}

function akki(hx,floorY){
  const hipY=floorY-H*0.105, tw=W*0.060, th=H*0.155, headR=H*0.036;
  rrect(hx-W*0.024,hipY,W*0.048,floorY-hipY,4);sx.fillStyle='#cdd6ea';sx.fill();sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.stroke();
  rrect(hx-W*0.058,floorY-2,W*0.116,H*0.020,3);sx.fillStyle='#1b2348';sx.fill();
  rrect(hx-tw/2,hipY-th,tw,th,6);sx.fillStyle='#d3def0';sx.fill();sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.stroke();
  sx.beginPath();sx.arc(hx,hipY-th-headR*0.6,headR,0,7);sx.fillStyle='#f0d8c0';sx.fill();sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.stroke();
  return hipY-th*0.5;}

function draw(){sx.clearRect(0,0,W,H);
  const ground = frame==='ground';
  const platY=H*0.80, carW=W*0.56, carH=H*0.46;
  // platform band + posts
  sx.fillStyle='#e7e2d6';sx.fillRect(0,platY,W,H-platY);
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,platY);sx.lineTo(W,platY);sx.stroke();
  const PS=W*0.11; const off = ground?0:(x%PS);
  sx.strokeStyle='#b9b09a';sx.lineWidth=3;
  for(let i=-1;i<W/PS+2;i++){const px=i*PS-off;sx.beginPath();sx.moveTo(px,platY+4);sx.lineTo(px,platY+H*0.05);sx.stroke();}

  // car position
  const carLeft = ground ? (-carW*0.30 + x) : (W-carW)/2;
  const carY0 = platY-carH-H*0.03, carY1 = platY-H*0.02, floorY=carY1-H*0.012;
  // speed lines
  if(v>0.05){sx.strokeStyle='rgba(27,35,72,'+Math.min(0.45,v/W*0.6)+')';sx.lineWidth=2;
    for(let i=0;i<4;i++){const y=carY0+ (0.2+i*0.2)*carH;const ln=W*0.04+v/W*W*0.10;
      const bx = ground ? carLeft-W*0.02-i*9 : carLeft-W*0.03-((x*1.5+i*31)%(W*0.18));
      sx.beginPath();sx.moveTo(bx,y);sx.lineTo(bx-ln,y);sx.stroke();}}
  // wheels
  sx.fillStyle='#1b2348';
  for(const wf of [0.26,0.74]){const wx=carLeft+carW*wf;sx.beginPath();sx.arc(wx,carY1+H*0.018,H*0.026,0,7);sx.fill();}
  // car
  rrect(carLeft,carY0,carW,carH,13);sx.fillStyle='#eef1f7';sx.fill();sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.stroke();
  rrect(carLeft+carW*0.10,carY0+H*0.035,carW*0.80,H*0.085,7);sx.fillStyle='#dbe7f3';sx.fill();sx.lineWidth=1.6;sx.stroke();
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(carLeft+5,floorY);sx.lineTo(carLeft+carW-5,floorY);sx.stroke();

  const hx=carLeft+carW*0.5;
  const com=akki(hx,floorY);
  const len=W*0.155;
  // friction: real, forward, in BOTH frames
  arrow(hx,com,len,0,'#2fa84f',4.2);tag('friction',hx+len*0.55,com-H*0.045,'#2fa84f','center',10.5);
  if(!ground){arrow(hx,com,-len,0,'#E24B4A',4.2);tag('pseudo',hx-len*0.55,com-H*0.045,'#E24B4A','center',10.5);}

  // headers + roof note
  const F=m*a;
  if(ground){
    arrow(hx-W*0.10,carY0-H*0.028,W*0.20,0,'#185FA5',3.4);
    tag('a = 2 m/s\u00B2  (speeding up)',hx,carY0-H*0.072,'#185FA5','center',10);
    tag('GROUND frame: she accelerates with the car',W*0.5,H*0.065,'#1b2348','center',11.5);
    tag('one real force: friction = m\u00b7a = '+F+' N  \u2192  net = '+F+' N',W*0.5,H*0.115,'#2fa84f','center',10.5);
  }else{
    tag('riding along: the ground rushes backward',hx,carY0-H*0.05,'#7A4FA3','center',10);
    tag('TRAIN frame: she looks at rest',W*0.5,H*0.065,'#1b2348','center',11.5);
    tag('friction + pseudo = 0  \u2192  at rest here',W*0.5,H*0.115,'#5b6172','center',10.5);
    tag('pseudo force = m\u00b7a = '+F+' N,  opposite a,  no reaction pair',W*0.5,H*0.965,'#E24B4A','center',10);
  }
}

function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  v+=A*dt; x+=v*dt; if(x>xMax){x=0;v=0;}
  draw();requestAnimationFrame(loop);}

fbtns.addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;frame=b.dataset.f;x=0;v=0;
  [...fbtns.children].forEach(c=>c.classList.toggle('on',c===b));draw();});
window.addEventListener('resize',fit);
fit();requestAnimationFrame(loop);
</script></body></html>
