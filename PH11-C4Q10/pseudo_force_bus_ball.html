<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pseudo Force — The Bus &amp; The Ball</title>
<style>
  :root{
    --bg:#f4f0e3; --navy:#1b2032; --card:#fffdf6;
    --yellow:#ffd233; --red:#e0453f; --green:#2fa05c; --blue:#3a78c2;
    --ink:#1b2032; --ink2:#5c5a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;}
  body{
    background:#cfcaba;
    display:flex;justify-content:center;align-items:center;
    overflow:hidden;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif;
  }
  /* fixed 480x640 stage (3:4), scaled to fit viewport */
  #stage{
    width:480px;height:640px;background:var(--bg);
    transform-origin:center center;
    display:flex;flex-direction:column;
    box-shadow:0 0 0 9999px #cfcaba;
  }
  .topbar{
    background:var(--navy);color:var(--yellow);
    text-align:center;font-weight:bold;font-style:italic;
    font-size:17px;letter-spacing:1px;
    padding:9px 0 10px;flex-shrink:0;
  }
  .purpose{
    margin:8px 14px 6px;background:var(--card);
    border:2px solid var(--navy);border-radius:12px;
    box-shadow:3px 3px 0 rgba(27,32,50,.25);
    padding:7px 12px;font-size:12.5px;line-height:1.35;
    color:var(--ink);text-align:center;font-weight:bold;
  }
  .panel{
    margin:6px 14px 0;background:var(--card);
    border:2px solid var(--navy);border-radius:14px;
    box-shadow:3px 3px 0 rgba(27,32,50,.25);
    overflow:hidden;flex-shrink:0;
  }
  .panel-head{
    display:flex;align-items:center;gap:7px;
    padding:4px 10px;border-bottom:2px solid var(--navy);
    font-size:12px;font-weight:bold;letter-spacing:.5px;
  }
  .panel-head.ground{background:#e6f2e9;color:#19663a}
  .panel-head.bus{background:#fdeaea;color:#a02620}
  .eye{font-style:normal}
  canvas{display:block;width:100%}
  .controls{
    margin:auto 14px 12px;background:var(--card);
    border:2px solid var(--navy);border-radius:14px;
    box-shadow:3px 3px 0 rgba(27,32,50,.25);
    padding:9px 12px;display:flex;align-items:center;gap:12px;
    flex-shrink:0;
  }
  .sl-wrap{flex:1}
  .sl-label{
    display:flex;justify-content:space-between;
    font-size:11px;font-weight:bold;color:var(--ink);
    margin-bottom:2px;
  }
  .sl-label .val{color:var(--red)}
  input[type=range]{
    width:100%;accent-color:var(--red);cursor:pointer;height:22px;
  }
  #goBtn{
    background:var(--yellow);color:var(--navy);
    border:2px solid var(--navy);border-radius:12px;
    box-shadow:2px 2px 0 var(--navy);
    font-family:inherit;font-weight:bold;font-size:15px;
    padding:9px 18px;cursor:pointer;min-width:96px;
    transition:transform .06s;
  }
  #goBtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--navy)}
  #goBtn.reset{background:#fff;color:var(--red)}
</style>
</head>
<body>
<div id="stage">

  <div class="topbar">PSEUDO FORCE &nbsp;·&nbsp; THE BUS &amp; THE BALL</div>

  <div class="purpose">
    One ball, two views: from the <span style="color:#19663a">ground</span> no force acts on it,
    but from <span style="color:#a02620">inside the speeding-up bus</span> a mystery force appears!
  </div>

  <div class="panel">
    <div class="panel-head ground"><span class="eye">👁</span> VIEW 1 · STANDING ON THE GROUND</div>
    <canvas id="cg" width="448" height="175"></canvas>
  </div>

  <div class="panel">
    <div class="panel-head bus"><span class="eye">👁</span> VIEW 2 · SITTING INSIDE THE BUS</div>
    <canvas id="cb" width="448" height="175"></canvas>
  </div>

  <div class="controls">
    <div class="sl-wrap">
      <div class="sl-label"><span>Bus acceleration</span><span class="val" id="aVal">2.0 m/s²</span></div>
      <input type="range" id="aSl" min="0.5" max="5" step="0.5" value="2">
    </div>
    <button id="goBtn">GO ▶</button>
  </div>

</div>

<script>
/* ---------- scale 480x640 stage to viewport, keeping 3:4 ---------- */
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(window.innerWidth/480, window.innerHeight/640);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fit); fit();

/* ---------- simulation state ---------- */
const PPM=26;                 // pixels per metre
const BUS_LEN=5.0;            // m
const WALL=0.32;              // interior wall thickness (m)
const BALL_R=0.30;            // m
let a=2.0;                    // bus acceleration
let busX=1.0;                 // rear of bus (m), ground frame
let busV=0;
let ballX=busX+BUS_LEN-WALL-0.55;  // ball starts near FRONT wall
let state='idle';             // idle | run | hit
let last=null;

const cg=document.getElementById('cg').getContext('2d');
const cb=document.getElementById('cb').getContext('2d');
const goBtn=document.getElementById('goBtn');
const W=448,H=175, ROAD=145;

function reset(){
  busX=1.0; busV=0; state='idle'; 
  ballX=busX+BUS_LEN-WALL-0.55;
  goBtn.textContent='GO ▶'; goBtn.classList.remove('reset');
}

document.getElementById('aSl').addEventListener('input',e=>{
  a=parseFloat(e.target.value);
  document.getElementById('aVal').textContent=a.toFixed(1)+' m/s²';
});
goBtn.addEventListener('click',()=>{
  if(state==='idle'){
    state='run';
    goBtn.textContent='RESET ↺'; goBtn.classList.add('reset');
  }else{
    reset();
  }
});

/* ---------- drawing helpers ---------- */
function arrow(ctx,x1,y1,x2,y2,color,wd){
  const hd=7+wd, ang=Math.atan2(y2-y1,x2-x1);
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=wd;
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hd*Math.cos(ang-0.45), y2-hd*Math.sin(ang-0.45));
  ctx.lineTo(x2-hd*Math.cos(ang+0.45), y2-hd*Math.sin(ang+0.45));
  ctx.closePath();ctx.fill();
}

function drawScene(ctx,camX,isBusFrame){
  ctx.clearRect(0,0,W,H);
  // sky
  ctx.fillStyle='#eaf4fb'; ctx.fillRect(0,0,W,ROAD);
  // clouds (scroll with world)
  ctx.fillStyle='#ffffff';
  for(let i=0;i<4;i++){
    let wx=((i*6.1+2 - camX*0.4)%24+24)%24;     // wrap every 24 m
    let px=wx*PPM-40;
    ctx.beginPath();
    ctx.arc(px,26+(i%2)*10,11,0,7);ctx.arc(px+13,24+(i%2)*10,14,0,7);ctx.arc(px+27,27+(i%2)*10,10,0,7);
    ctx.fill();
  }
  // trees / posts on ground (these tell you the ground is moving in bus view)
  for(let i=0;i<8;i++){
    let wx=((i*3.4+0.8 - camX)%28+28)%28;
    let px=wx*PPM-30;
    ctx.fillStyle='#8a6b46'; ctx.fillRect(px-2,ROAD-26,4,26);
    ctx.fillStyle='#5da66b';
    ctx.beginPath();ctx.arc(px,ROAD-32,11,0,7);ctx.fill();
    ctx.strokeStyle='#1b2032';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(px,ROAD-32,11,0,7);ctx.stroke();
    ctx.strokeRect(px-2,ROAD-26,4,26);
  }
  // road
  ctx.fillStyle='#c9c3ae'; ctx.fillRect(0,ROAD,W,H-ROAD);
  ctx.fillStyle='#1b2032'; ctx.fillRect(0,ROAD,W,3);
  // dashed centre marks
  ctx.fillStyle='#fff';
  for(let i=0;i<16;i++){
    let wx=((i*1.6 - camX)%26+26)%26;
    ctx.fillRect(wx*PPM-20,ROAD+12,18,4);
  }

  /* ---- bus (cutaway) ---- */
  const bx=(busX-camX)*PPM;            // rear of bus in px
  const bw=BUS_LEN*PPM, busTop=ROAD-70, busH=64;
  // body
  ctx.fillStyle='#ffd233';
  roundRect(ctx,bx,busTop,bw,busH,9,true);
  // interior cutaway
  ctx.fillStyle='#fff8e2';
  ctx.fillRect(bx+WALL*PPM,busTop+22,bw-2*WALL*PPM,busH-26);
  // floor line
  ctx.fillStyle='#caa83f';
  ctx.fillRect(bx+WALL*PPM,busTop+busH-7,bw-2*WALL*PPM,4);
  // roof strip + windows hint
  ctx.fillStyle='#e8b62a'; ctx.fillRect(bx,busTop,bw,16);
  // outline
  ctx.strokeStyle='#1b2032'; ctx.lineWidth=2.5;
  roundRect(ctx,bx,busTop,bw,busH,9,false);
  ctx.strokeRect(bx+WALL*PPM,busTop+22,bw-2*WALL*PPM,busH-26);
  // driver window + driver
  ctx.fillStyle='#bfe3f5';
  ctx.fillRect(bx+bw-26,busTop+4,20,14);
  ctx.strokeRect(bx+bw-26,busTop+4,20,14);
  // passenger (you) sitting at rear interior
  const pyx=bx+WALL*PPM+16, pyy=busTop+busH-12;
  ctx.fillStyle='#3a78c2';
  ctx.beginPath();ctx.arc(pyx,pyy-20,6,0,7);ctx.fill();           // head
  ctx.fillRect(pyx-5,pyy-14,10,12);                                // body
  ctx.strokeStyle='#1b2032';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(pyx,pyy-20,6,0,7);ctx.stroke();
  ctx.strokeRect(pyx-5,pyy-14,10,12);
  // wheels
  wheel(ctx,bx+22,ROAD+2); wheel(ctx,bx+bw-22,ROAD+2);

  /* ---- ball ---- */
  const ballPx=(ballX-camX)*PPM;
  const ballPy=busTop+busH-7-BALL_R*PPM;
  ctx.fillStyle='#e0453f';
  ctx.beginPath();ctx.arc(ballPx,ballPy,BALL_R*PPM,0,7);ctx.fill();
  ctx.strokeStyle='#1b2032';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ballPx,ballPy,BALL_R*PPM,0,7);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ballPx-2.5,ballPy-3,2.4,0,7);ctx.fill();

  /* ---- frame-specific annotations ---- */
  ctx.font='bold 11px "Comic Sans MS",sans-serif';
  if(!isBusFrame){
    // ground view: bus velocity arrow + "no force" tag on ball
    if(busV>0.05){
      const len=Math.min(20+busV*9,70);
      arrow(ctx,bx+bw*0.5-len/2,busTop-12,bx+bw*0.5+len/2,busTop-12,'#2fa05c',4);
      ctx.fillStyle='#19663a'; ctx.textAlign='center';
      ctx.fillText('bus speeds up →',bx+bw*0.5,busTop-20);
    }
    if(state==='run'){
      ctx.fillStyle='#19663a'; ctx.textAlign='center';
      ctx.fillText('no push on ball',ballPx,ballPy-14);
    }
  }else{
    // bus view: pseudo-force arrow on ball
    if(state==='run'&&a>0){
      const len=12+a*9;
      arrow(ctx,ballPx-2,ballPy,ballPx-2-len,ballPy,'#e0453f',4.5);
      ctx.fillStyle='#a02620'; ctx.textAlign='center';
      ctx.fillText('pseudo force',ballPx-len/2-4,ballPy-13);
    }
    if(state==='hit'){
      ctx.fillStyle='#a02620'; ctx.textAlign='center';
      ctx.font='bold 15px "Comic Sans MS",sans-serif';
      ctx.fillText('BONK!',ballPx+26,ballPy-18);
    }
  }
}
function roundRect(ctx,x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  fill?ctx.fill():ctx.stroke();
}
function wheel(ctx,x,y){
  ctx.fillStyle='#1b2032';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
  ctx.fillStyle='#cfcaba';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
}

/* ---------- main loop ---------- */
function tick(ts){
  if(last===null)last=ts;
  let dt=Math.min((ts-last)/1000,0.04); last=ts;

  if(state==='run'){
    busV+=a*dt;
    busX+=busV*dt;
    // ball: frictionless → stays at ballX (no change)
    // collision with rear interior wall?
    if(ballX-BALL_R <= busX+WALL){
      ballX=busX+WALL+BALL_R;
      state='hit';
    }
  }
  if(state==='hit'){
    // ball now rides with the wall
    busV+=a*dt; busX+=busV*dt;
    ballX=busX+WALL+BALL_R;
  }

  // ground camera: fixed, but pan slightly if bus runs far right
  let camG=Math.max(0,busX+BUS_LEN-15.5);
  drawScene(cg,camG,false);
  // bus camera: keep bus centred
  let camB=busX+BUS_LEN/2-(W/PPM)/2;
  drawScene(cb,camB,true);

  requestAnimationFrame(tick);
}
reset();
requestAnimationFrame(tick);
</script>
</body>
</html>
