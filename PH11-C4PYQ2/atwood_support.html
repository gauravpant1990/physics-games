<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>What the Pulley Pulls On the Support</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:22px}
  .val{font-size:12.5px;font-weight:800;color:#185FA5;min-width:52px;text-align:right}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">What the Pulley Pulls On the Support</div>
    <div class="sub">Two masses hang over a pulley. The support feels the two rope pulls, 2T. Once the masses are unequal and moving, that is less than their total weight.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>right mass</label><input type="range" id="m2" min="4" max="10" step="1" value="6"><span class="val" id="m2v">6 kg</span></div>
  </div>
  <div class="foot">Laws of Motion &middot; Atwood &middot; support force = 2T, not the total weight</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const m2E=document.getElementById('m2'),m2v=document.getElementById('m2v');
let W=360,H=468;const ASPECT=1.30;
const M1=4,G=10;
let m2=6;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.55);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}
function wheel(x,y,r){sx.fillStyle='#e8e2d4';sx.beginPath();sx.arc(x,y,r,0,7);sx.fill();
  sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.stroke();sx.fillStyle='#1b2348';sx.beginPath();sx.arc(x,y,r*0.26,0,7);sx.fill();}
function mass(x,y,kg,col){const s=W*0.05+kg*W*0.006;sx.fillStyle=col;sx.fillRect(x-s/2,y-s/2,s,s);
  sx.lineWidth=2;sx.strokeStyle='#0f3f70';sx.strokeRect(x-s/2,y-s/2,s,s);
  tag(kg+' kg',x,y+s/2+H*0.026,'#1b2348','center',10.5,800);return s;}
function draw(){sx.clearRect(0,0,W,H);
  const T=2*M1*m2*G/(M1+m2), support=2*T, total=(M1+m2)*G, acc=(m2-M1)/(M1+m2)*G;
  const px=W*0.5, py=H*0.24, r=W*0.06;
  // support rod
  sx.fillStyle='#cfc7b6';sx.fillRect(W*0.30,H*0.08-H*0.02,W*0.40,H*0.022);
  sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.strokeRect(W*0.30,H*0.08-H*0.02,W*0.40,H*0.022);
  sx.strokeStyle='#8a8f80';sx.lineWidth=3;sx.beginPath();sx.moveTo(px,H*0.08);sx.lineTo(px,py-r);sx.stroke();
  // support-force arrow (down on the rod)
  arrow(px+W*0.10,H*0.085,0,H*0.05,'#185FA5',4.5);
  tag('2T on support',px+W*0.13,H*0.11,'#185FA5','left',10.5,800);
  // ropes and masses (heavier side lower)
  const lx=px-r, rx=px+r, base=H*0.40, drop=(m2-M1)*W*0.012;
  const yL=base-drop, yR=base+drop;
  sx.strokeStyle='#bb8047';sx.lineWidth=4;sx.lineCap='round';
  sx.beginPath();sx.moveTo(lx,py);sx.lineTo(lx,yL);sx.stroke();
  sx.beginPath();sx.moveTo(rx,py);sx.lineTo(rx,yR);sx.stroke();
  wheel(px,py,r);
  const sL=mass(lx,yL,M1,'#185FA5'), sR=mass(rx,yR,m2,'#7A4FA3');
  // tension labels on the two strands
  tag('T',lx-W*0.04,(py+yL)/2,'#b06a18','center',10.5,800);
  tag('T',rx+W*0.04,(py+yR)/2,'#b06a18','center',10.5,800);
  // motion hint
  if(acc>0.01){arrow(rx+W*0.075,yR-W*0.02,0,W*0.07,'#1D9E75',3);arrow(lx-W*0.075,yL+W*0.02,0,-W*0.07,'#1D9E75',3);}
  // ---- bars: support vs total weight ----
  const bx=W*0.16,bw=W*0.68,y1=H*0.64,y2=H*0.71,maxF=200,X=v=>(v/maxF)*bw;
  sx.fillStyle='#c8c2b4';sx.fillRect(bx,y1,X(total),H*0.03);
  tag('total weight '+total.toFixed(0)+' N',bx+X(total)+W*0.02,y1+H*0.015,'#8a8f80','left',9.5,800);
  sx.fillStyle='#185FA5';sx.fillRect(bx,y2,X(support),H*0.03);
  tag('support 2T '+support.toFixed(0)+' N',bx+X(support)+W*0.02,y2+H*0.015,'#185FA5','left',9.5,800);
  // ---- readouts ----
  tag('T = '+T.toFixed(0)+' N     support = 2T = '+support.toFixed(0)+' N',W*0.5,H*0.80,'#1b2348','center',13.5,800);
  tag(Math.abs(acc)<0.01?'balanced: support equals the total weight'
      :'they accelerate ('+acc.toFixed(1)+' m/s\u00b2), so 2T is below the total weight',
      W*0.5,H*0.855,acc<0.01?'#1d7a37':'#c0653a','center',11,800);
  tag('a heavier pull down means the support carries less, not more',W*0.5,H*0.905,'#5b6172','center',10,700);
}
m2E.addEventListener('input',()=>{m2=+m2E.value;m2v.textContent=m2+' kg';draw();});
window.addEventListener('resize',fit);
fit();
</script></body></html>
