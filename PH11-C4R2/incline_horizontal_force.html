<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Holding a Block with a Horizontal Push</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:24px}
  .val{font-size:13px;font-weight:800;color:#185FA5;min-width:42px;text-align:right}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Holding a Block with a Horizontal Push</div>
    <div class="sub">A horizontal push holds a block on a smooth slope. Only part of it acts along the slope, so the push needed is mg tan&theta;, and it shoots up as the slope steepens.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>slope angle</label>
      <input type="range" id="ang" min="0" max="45" step="1" value="30">
      <span class="val" id="angv">30&deg;</span></div>
  </div>
  <div class="foot">Laws of Motion &middot; Incline &middot; horizontal force, F = mg tan&theta;</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const ang=document.getElementById('ang'),angv=document.getElementById('angv');
let W=360,H=468;const ASPECT=1.30, M=20, g=10, WT=200;   // 20 kg
let theta=30;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(12,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}

function draw(){sx.clearRect(0,0,W,H);
  const th=theta*Math.PI/180, ST=Math.sin(th), CT=Math.cos(th);
  const F=WT*Math.tan(th);
  // incline triangle: base is FIXED; at steep angles the apex simply runs off the top (clipped)
  const ax=W*0.12, by=H*0.56, base=W*0.72;
  const A={x:ax,y:by}, B={x:ax+base,y:by}, C={x:ax+base,y:by-base*Math.tan(th)};
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,by);sx.lineTo(W,by);sx.stroke();
  sx.save();sx.beginPath();sx.rect(0,0,W,H);sx.clip();          // keep fill inside the frame
  sx.beginPath();sx.moveTo(A.x,A.y);sx.lineTo(B.x,B.y);sx.lineTo(C.x,C.y);sx.closePath();
  sx.fillStyle='#e9e3d6';sx.fill();sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.stroke();
  sx.restore();
  tag(theta+'\u00b0',A.x+W*0.135,A.y-W*0.04,'#1b2348','left',12,800);
  // block sits low on the slope so it stays visible at every angle
  const u={x:CT,y:-ST}, nrm={x:-ST,y:-CT};
  const d=Math.min(0.5*base/CT, 0.40*H/ST), bw=W*0.09,bh=W*0.06;
  const bc={x:A.x+u.x*d,y:A.y+u.y*d};
  const ctr={x:bc.x+nrm.x*(bh*0.5+2),y:bc.y+nrm.y*(bh*0.5+2)};
  sx.save();sx.translate(ctr.x,ctr.y);sx.rotate(-th);
  sx.fillStyle='#185FA5';sx.fillRect(-bw/2,-bh/2,bw,bh);sx.lineWidth=2;sx.strokeStyle='#0f3f70';sx.strokeRect(-bw/2,-bh/2,bw,bh);
  sx.restore();
  // forces on block
  const fs=0.0008*W, cap=W*0.27;
  const Fl=Math.min(cap,F*fs);
  arrow(ctr.x,ctr.y,Fl,0,'#185FA5',4.6);                       // horizontal push (into the hill, right)
  tag('F',ctr.x+Fl+W*0.03,ctr.y,'#185FA5','left',12,800);
  arrow(ctr.x,ctr.y,0,WT*fs,'#E24B4A',4.6);                    // weight down
  tag('mg',ctr.x-W*0.035,ctr.y+WT*fs*0.55,'#E24B4A','right',11,800);
  // readout
  const ry=H*0.70;
  tag('push  F = mg tan\u03b8 = '+Math.round(F)+' N',W*0.5,ry,'#185FA5','center',15,800);
  tag('along the slope:  F cos\u03b8  balances  mg sin\u03b8',W*0.5,ry+H*0.055,'#1b2348','center',11.5,800);
  tag('( mg sin\u03b8 = '+Math.round(WT*ST)+' N, yet the push must be '+Math.round(F)+' N )',W*0.5,ry+H*0.105,'#5b6172','center',10.5,700);
  // bar: F vs mg
  const byb=H*0.90, scale=W*0.55/700;
  sx.fillStyle='#E24B4A';sx.fillRect(W*0.16,byb-H*0.018,WT*scale,H*0.022);
  sx.fillStyle='#185FA5';sx.fillRect(W*0.16,byb+H*0.012,Math.min(W*0.74,F*scale),H*0.022);
  tag('mg = 200 N',W*0.16+WT*scale+W*0.02,byb-H*0.007,'#E24B4A','left',9.5,800);
  tag('push F',W*0.16+Math.min(W*0.74,F*scale)+W*0.02,byb+H*0.023,'#185FA5','left',9.5,800);
}
ang.addEventListener('input',()=>{theta=+ang.value;angv.textContent=theta+'\u00b0';draw();});
window.addEventListener('resize',fit);
fit();
</script></body></html>
