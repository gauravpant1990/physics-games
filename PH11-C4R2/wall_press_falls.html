<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pressing a Block on a Wall</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:24px}
  .val{font-size:13px;font-weight:800;color:#185FA5;min-width:46px;text-align:right}
  .seg{display:flex;gap:6px;margin-top:9px}
  .seg button{flex:1;font-family:inherit;font-size:11.5px;font-weight:800;padding:7px 0;border-radius:8px;
    border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  .seg button.on{background:var(--navy);color:#ffcf33}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Pressing a Block on a Wall</div>
    <div class="sub">A 5 kg block is pressed to a wall by a horizontal push. The push only makes the wall push back, so on a smooth wall nothing acts upward and it falls at g however hard you press.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>push force</label>
      <input type="range" id="frc" min="20" max="160" step="5" value="80">
      <span class="val" id="frcv">80 N</span></div>
    <div class="seg">
      <button id="bs" class="on">smooth wall</button>
      <button id="br">rough wall</button>
    </div>
  </div>
  <div class="foot">Laws of Motion &middot; Direct F = ma &middot; a sideways push gives no vertical support</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const frc=document.getElementById('frc'),frcv=document.getElementById('frcv');
const bs=document.getElementById('bs'),br=document.getElementById('br');
let W=360,H=468;const ASPECT=1.30, M=5, g=10, MU=0.5;
let F=80, rough=false, wallScroll=0;

function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}

function held(){return rough && MU*F>=M*g;}
function accel(){if(held())return 0;const fr=rough?MU*F:0;return Math.max(0,g-fr/M);}

// scene geometry (also used by loop)
const sT=()=>H*0.06, sB=()=>H*0.40, bwS=()=>W*0.135;

function draw(){sx.clearRect(0,0,W,H);
  const a=accel(), hold=held();

  // ---------- SCENE: wall + sliding block (no force arrows here) ----------
  const wallX=W*0.24, top=sT(), bot=sB(), bw=bwS();
  sx.fillStyle='#cfc7b6';sx.fillRect(0,top-H*0.012,wallX,(bot-top)+H*0.085);
  sx.strokeStyle='#1b2348';sx.lineWidth=2.5;sx.beginPath();sx.moveTo(wallX,top-H*0.012);sx.lineTo(wallX,bot+H*0.07);sx.stroke();
  sx.strokeStyle=rough?'#9c6a2e':'#9aa0a8';sx.lineWidth=1.3;
  const sp=13; let off=wallScroll%sp; if(off<0)off+=sp;
  for(let y=top-off;y<bot+H*0.06+sp;y+=sp){sx.beginPath();sx.moveTo(wallX-7,y);sx.lineTo(wallX,y+5);sx.stroke();}
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(0,bot+H*0.07);sx.lineTo(W,bot+H*0.07);sx.stroke();
  const byTop= top+((bot-bw)-top)*0.40;
  const cx=wallX+bw/2, cy=byTop+bw/2;
  sx.fillStyle=hold?'#185FA5':'#E0892A';sx.fillRect(wallX,byTop,bw,bw);
  sx.lineWidth=2;sx.strokeStyle=hold?'#0f3f70':'#9c5a12';sx.strokeRect(wallX,byTop,bw,bw);
  if(hold){tag('held',wallX+bw+W*0.06,cy,'#1D9E75','left',13,800);}
  else{arrow(wallX+bw+W*0.07,cy-H*0.018,0,H*0.045,'#1D9E75',4);
       tag('falling',wallX+bw+W*0.13,cy,'#1D9E75','left',12.5,800);}
  tag(rough?'rough wall':'smooth wall',W*0.5,top-H*0.005+H*0.0,'#8a8f80','center',10,700);

  // ---------- STEADY FBD: forces on a fixed block ----------
  const fx=W*0.5, fy=H*0.595, s2=W*0.155;
  // mini wall at left
  sx.fillStyle='#cfc7b6';sx.fillRect(fx-s2/2-W*0.035,fy-s2*0.95,W*0.035,s2*1.9);
  sx.strokeStyle='#1b2348';sx.lineWidth=2;sx.beginPath();sx.moveTo(fx-s2/2,fy-s2*0.95);sx.lineTo(fx-s2/2,fy+s2*0.95);sx.stroke();
  sx.fillStyle=hold?'#185FA5':'#E0892A';sx.fillRect(fx-s2/2,fy-s2/2,s2,s2);
  sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.strokeRect(fx-s2/2,fy-s2/2,s2,s2);
  const fsH=W*0.0015, fsV=H*0.0019;
  // weight (down)
  const mgl=M*g*fsV;
  arrow(fx,fy+s2/2,0,mgl,'#E24B4A',4.6);
  tag('mg = '+(M*g)+' N',fx,fy+s2/2+mgl+H*0.018,'#E24B4A','center',10.5,800);
  // friction (up, rough only)
  if(rough){const fr=Math.min(MU*F,M*g);
    arrow(fx,fy-s2/2,0,-fr*fsV,'#8a8f80',4.6);
    tag('friction = '+Math.round(MU*F)+' N',fx,fy-s2/2-fr*fsV-H*0.018,'#8a8f80','center',10,800);}
  else{tag('no friction',fx,fy-s2/2-H*0.03,'#8a8f80','center',10,700);}
  // push (horizontal into wall)
  const pl=Math.min(W*0.19,F*fsH);
  arrow(fx+s2/2+pl,fy,-pl,0,'#185FA5',4.4);
  tag('push F = '+F+' N',fx+s2/2+pl+W*0.012,fy,'#185FA5','left',10,800);

  // ---------- VERDICT ----------
  const ry=H*0.81;
  tag('the push acts sideways, it cannot hold the block up',W*0.5,ry,'#5b6172','center',10.5,700);
  if(hold){
    tag('friction \u2265 weight  \u2192  block holds,   a = 0',W*0.5,ry+H*0.052,'#1D9E75','center',13.5,800);
  }else if(rough){
    tag('friction < weight  \u2192  a = '+a.toFixed(1)+' m/s\u00b2  down',W*0.5,ry+H*0.052,'#c0392b','center',13.5,800);
  }else{
    tag('smooth: no friction  \u2192  a = g = 10 m/s\u00b2  down',W*0.5,ry+H*0.052,'#c0392b','center',13.5,800);
  }
}
function reset(){wallScroll=0;}
function loop(){const a=accel();
  if(a>0.01){wallScroll+=a*0.16;}      // wall slides up -> block reads as falling; smooth (a=10) faster than rough slip
  draw();requestAnimationFrame(loop);}
frc.addEventListener('input',()=>{F=+frc.value;frcv.textContent=F+' N';reset();});
function setMode(r){rough=r;bs.classList.toggle('on',!r);br.classList.toggle('on',r);reset();}
bs.addEventListener('click',()=>setMode(false));
br.addEventListener('click',()=>setMode(true));
window.addEventListener('resize',fit);
fit();loop();
</script></body></html>
