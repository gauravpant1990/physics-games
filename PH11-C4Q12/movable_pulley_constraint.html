<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pull Twice as Far</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  input[type=range]{flex:1;accent-color:#185FA5;height:22px}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Pull Twice as Far</div>
    <div class="sub">The load hangs on two rope strands. Pull the free end and the load rises only half as much, so it also moves half as fast. That is the trick of the gym machine.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad">
    <div class="ctl"><label>pull the rope</label><input type="range" id="mv" min="0" max="100" step="1" value="40"></div>
  </div>
  <div class="foot">Laws of Motion &middot; Movable pulley &middot; load moves half the pull</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const mv=document.getElementById('mv');
let W=360,H=468;const ASPECT=1.30;
let s=0.40;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}
function wheel(x,y,r){sx.fillStyle='#e8e2d4';sx.beginPath();sx.arc(x,y,r,0,7);sx.fill();
  sx.lineWidth=2.5;sx.strokeStyle='#1b2348';sx.stroke();sx.fillStyle='#1b2348';sx.beginPath();sx.arc(x,y,r*0.26,0,7);sx.fill();}
function draw(){sx.clearRect(0,0,W,H);
  const beamY=H*0.13, r=W*0.05;
  const mx=W*0.46, anchorX=mx-r, fpx=mx+2*r, fpy=H*0.20;   // anchor above the pulley, strands vertical
  const my0=H*0.50, hand0=H*0.34, travH=H*0.24;
  const my=my0-travH*0.5*s, hand=hand0+travH*s;          // load up d/2, hand down d
  // beam
  sx.fillStyle='#cfc7b6';sx.fillRect(W*0.20,beamY-H*0.02,W*0.60,H*0.022);
  sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.strokeRect(W*0.20,beamY-H*0.02,W*0.60,H*0.022);
  // anchor tie
  sx.fillStyle='#8a8f80';sx.fillRect(anchorX-W*0.012,beamY+H*0.004,W*0.024,H*0.018);
  // ropes: anchor -> movable pulley left ; movable right -> fixed pulley -> hand
  sx.strokeStyle='#bb8047';sx.lineWidth=4;sx.lineCap='round';
  sx.beginPath();sx.moveTo(anchorX,beamY+H*0.02);sx.lineTo(mx-r,my);sx.stroke();
  sx.beginPath();sx.moveTo(mx+r,my);sx.lineTo(fpx-r,fpy);sx.stroke();
  sx.strokeStyle='#8a8f80';sx.lineWidth=3;sx.beginPath();sx.moveTo(fpx,beamY+H*0.004);sx.lineTo(fpx,fpy-r);sx.stroke();
  sx.strokeStyle='#bb8047';sx.lineWidth=4;sx.beginPath();sx.moveTo(fpx+r,fpy);sx.lineTo(fpx+r,hand);sx.stroke();
  wheel(fpx,fpy,r);
  // hang + load block on movable pulley
  sx.strokeStyle='#512f73';sx.lineWidth=3;sx.beginPath();sx.moveTo(mx,my+r);sx.lineTo(mx,my+r+H*0.03);sx.stroke();
  const lw=W*0.16,lh=W*0.11;sx.fillStyle='#7A4FA3';sx.fillRect(mx-lw/2,my+r+H*0.03,lw,lh);
  sx.lineWidth=2;sx.strokeStyle='#512f73';sx.strokeRect(mx-lw/2,my+r+H*0.03,lw,lh);
  wheel(mx,my,r);
  // hand marker
  sx.fillStyle='#185FA5';sx.beginPath();sx.arc(fpx+r,hand,W*0.02,0,7);sx.fill();
  // start guides + displacement arrows
  sx.strokeStyle='#cdbfa3';sx.lineWidth=1.4;sx.setLineDash([4,4]);
  sx.beginPath();sx.moveTo(fpx+r-W*0.10,hand0);sx.lineTo(fpx+r+W*0.06,hand0);sx.stroke();
  sx.beginPath();sx.moveTo(mx-W*0.14,my0);sx.lineTo(mx+W*0.02,my0);sx.stroke();sx.setLineDash([]);
  if(s>0.02){
    arrow(fpx+r+W*0.05,hand0,0,travH*s,'#185FA5',4);tag('you pull  d',fpx+r+W*0.08,hand0+travH*s*0.5,'#185FA5','left',10.5,800);
    arrow(mx-W*0.10,my0,0,-travH*0.5*s,'#1D9E75',4);tag('load  d/2',mx-W*0.13,my0-travH*0.25*s,'#1d7a37','right',10.5,800);
  }
  tag('pull the rope twice as far as the load moves',W*0.5,H*0.80,'#1b2348','center',12,800);
  tag('half the motion means you need only half the force',W*0.5,H*0.86,'#5b6172','center',10.5,700);
}
mv.addEventListener('input',()=>{s=+mv.value/100;draw();});
window.addEventListener('resize',fit);
fit();
</script></body></html>
