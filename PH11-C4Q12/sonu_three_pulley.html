<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sonu's Three-Part Machine</title>
<style>
  :root{--navy:#1b2348;--cream:#f2efe9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh;height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:8px 0;overflow:hidden}
  .wrap{width:360px;max-width:94vw}
  .card{background:#fff;border:2px solid var(--navy);border-radius:12px;margin-bottom:7px}
  .card.pad{padding:10px 12px}
  .head{font-size:14.5px;font-weight:800;color:var(--navy)}
  .sub{font-size:11px;color:#5b6172;margin-top:3px;line-height:1.35}
  canvas{display:block;width:100%;border-radius:10px}
  .btn{width:100%;font-family:inherit;font-size:13px;font-weight:800;padding:10px;border-radius:9px;border:2px solid #1d7a37;background:#2fa84f;color:#fff;cursor:pointer}
  .foot{font-size:10px;color:#8a8f9c;text-align:center;padding:2px 0 0}
</style></head>
<body>
<div class="wrap">
  <div class="card pad">
    <div class="head">Sonu's Three-Part Machine</div>
    <div class="sub">One movable pulley and two fixed ones. Three rope parts hold the weight, so Sonu pulls only a third of it, and must pull three times as far as it rises.</div>
  </div>
  <div class="card"><canvas id="scene"></canvas></div>
  <div class="card pad"><button class="btn" id="go">Pull the rope</button></div>
  <div class="foot">Laws of Motion &middot; Constraint &middot; force = weight &divide; 3</div>
</div>
<script>
const scn=document.getElementById('scene'),sx=scn.getContext('2d');
const go=document.getElementById('go');
let W=360,H=480;const ASPECT=1.3333, WT=750;   // 75 kg stack
let mode='ready',t=0;
function sizeCanvas(w){W=w;H=Math.round(w*ASPECT);const d=window.devicePixelRatio||1;
  scn.style.height=H+'px';scn.width=Math.round(W*d);scn.height=Math.round(H*d);sx.setTransform(d,0,0,d,0,0);}
function fit(){const wrap=document.querySelector('.wrap');
  const vw=document.documentElement.clientWidth||360,vh=window.innerHeight||640;
  const cap=Math.min(vw*0.94,360);let w=cap;wrap.style.width=w+'px';sizeCanvas(w);
  let chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);const avail=vh-20;
  for(let i=0;i<3&&(chrome+w*ASPECT>avail);i++){w=Math.min(cap,Math.max(160,(avail-chrome)/ASPECT));
    wrap.style.width=w+'px';sizeCanvas(w);chrome=wrap.offsetHeight-parseFloat(scn.style.height||0);}
  draw();}
function arrow(x,y,dx,dy,col,wd){const L=Math.hypot(dx,dy);if(L<1)return;const ux=dx/L,uy=dy/L,hl=Math.min(11,L*0.5);
  sx.strokeStyle=col;sx.fillStyle=col;sx.lineWidth=wd;sx.lineCap='round';
  sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+dx-ux*hl*0.6,y+dy-uy*hl*0.6);sx.stroke();
  sx.beginPath();sx.moveTo(x+dx,y+dy);sx.lineTo(x+dx-ux*hl-uy*hl*0.5,y+dy-uy*hl+ux*hl*0.5);
  sx.lineTo(x+dx-ux*hl+uy*hl*0.5,y+dy-uy*hl-ux*hl*0.5);sx.closePath();sx.fill();}
function tag(t,x,y,col,al,sz,wt){sx.font=(wt||800)+' '+(sz||11)+'px Trebuchet MS,sans-serif';sx.textAlign=al||'center';
  sx.textBaseline='middle';sx.lineWidth=3.4;sx.strokeStyle='rgba(255,255,255,.95)';sx.lineJoin='round';
  sx.strokeText(t,x,y);sx.fillStyle=col;sx.fillText(t,x,y);}
function wheel(x,y,r){sx.fillStyle='#e8e2d4';sx.beginPath();sx.arc(x,y,r,0,7);sx.fill();
  sx.lineWidth=2.2;sx.strokeStyle='#1b2348';sx.stroke();sx.fillStyle='#1b2348';sx.beginPath();sx.arc(x,y,r*0.28,0,7);sx.fill();}
function seg(a,b,c,d){sx.strokeStyle='#1D9E75';sx.lineWidth=4;sx.lineCap='round';sx.beginPath();sx.moveTo(a,b);sx.lineTo(c,d);sx.stroke();}
function draw(){sx.clearRect(0,0,W,H);
  const beamY=H*0.12, rF=W*0.026, rM=W*0.03, PT=H*0.18, prog=(mode==='ready')?0:t;
  const cx=W*0.42, Fy=H*0.18;
  const F1x=cx-rM-rF, F2x=cx+rM+rF, tieX=F1x-rF;
  const loadTop0=H*0.52, loadTop=loadTop0-PT*prog/3;
  const hand0=H*0.30, hand=hand0+PT*prog;
  // beam
  sx.fillStyle='#cfc7b6';sx.fillRect(W*0.14,beamY-H*0.02,W*0.66,H*0.02);
  sx.lineWidth=2;sx.strokeStyle='#1b2348';sx.strokeRect(W*0.14,beamY-H*0.02,W*0.66,H*0.02);
  sx.strokeStyle='#8a8f80';sx.lineWidth=2.5;
  sx.beginPath();sx.moveTo(F1x,beamY);sx.lineTo(F1x,Fy-rF);sx.stroke();
  sx.beginPath();sx.moveTo(F2x,beamY);sx.lineTo(F2x,Fy-rF);sx.stroke();
  // three vertical supporting parts (green): tie->F1, F1->M, M->F2
  seg(tieX,loadTop,tieX,Fy);
  seg(F1x+rF,Fy,F1x+rF,loadTop);
  seg(cx+rM,loadTop,cx+rM,Fy);
  // free end (brown): over F2, straight down to the hand
  sx.strokeStyle='#bb8047';sx.lineWidth=4;sx.lineCap='round';sx.beginPath();sx.moveTo(F2x+rF,Fy);sx.lineTo(F2x+rF,hand);sx.stroke();
  wheel(F1x,Fy,rF);wheel(F2x,Fy,rF);
  // load + movable pulley + tie stub
  const lw=W*0.26,lh=W*0.13;sx.fillStyle='#7A4FA3';sx.fillRect(cx-lw/2,loadTop+H*0.02,lw,lh);
  sx.lineWidth=2;sx.strokeStyle='#512f73';sx.strokeRect(cx-lw/2,loadTop+H*0.02,lw,lh);
  sx.strokeStyle='#512f73';sx.lineWidth=3;
  sx.beginPath();sx.moveTo(cx,loadTop+rM);sx.lineTo(cx,loadTop+H*0.02);sx.stroke();
  sx.beginPath();sx.moveTo(tieX,loadTop);sx.lineTo(tieX,loadTop+H*0.02);sx.stroke();
  wheel(cx,loadTop,rM);
  sx.fillStyle='#185FA5';sx.beginPath();sx.arc(F2x+rF,hand,W*0.02,0,7);sx.fill();
  tag('weight '+WT+' N',cx,loadTop+H*0.02+lh+H*0.03,'#7A4FA3','center',10.5,800);
  // start guides + displacement arrows
  sx.strokeStyle='#cdbfa3';sx.lineWidth=1.4;sx.setLineDash([4,4]);
  sx.beginPath();sx.moveTo(F2x+rF-W*0.10,hand0);sx.lineTo(F2x+rF+W*0.05,hand0);sx.stroke();
  sx.beginPath();sx.moveTo(cx-lw/2-W*0.03,loadTop0);sx.lineTo(cx+lw/2+W*0.03,loadTop0);sx.stroke();sx.setLineDash([]);
  if(prog>0.03){
    arrow(F2x+rF+W*0.045,hand0,0,PT*prog,'#185FA5',4);tag('d',F2x+rF+W*0.075,hand0+PT*prog*0.5,'#185FA5','left',12,800);
    arrow(cx-lw/2-W*0.03,loadTop0,0,-PT*prog/3,'#1D9E75',4);tag('d/3',cx-lw/2-W*0.055,loadTop0-PT*prog/6,'#1d7a37','right',11.5,800);
  }
  // readouts
  tag('3 rope parts hold the weight',W*0.5,H*0.72,'#1b2348','center',12.5,800);
  tag('you pull 3 times as far as it rises',W*0.5,H*0.775,'#1d7a37','center',11.5,800);
  // effort bar
  const bX=W*0.22,y1=H*0.83,y2=H*0.885,sc=W*0.52/WT;
  tag('weight',bX-W*0.02,y1+H*0.013,'#8a8f80','right',9.5,800);
  sx.fillStyle='#c8c2b4';sx.fillRect(bX,y1,WT*sc,H*0.024);
  tag('you pull',bX-W*0.02,y2+H*0.013,'#185FA5','right',9.5,800);
  sx.fillStyle='#185FA5';sx.fillRect(bX,y2,(WT/3)*sc,H*0.024);
  tag('weight \u00f7 3 = '+Math.round(WT/3)+' N',bX+(WT/3)*sc+W*0.02,y2+H*0.013,'#185FA5','left',9.5,800);
}
function loop(){if(mode!=='playing')return;t+=0.006;if(t>=1){t=1;mode='done';go.textContent='Reset';draw();return;}draw();requestAnimationFrame(loop);}
go.addEventListener('click',()=>{if(mode==='playing')return;
  if(mode==='done'){mode='ready';t=0;go.textContent='Pull the rope';draw();}
  else{mode='playing';t=0;go.textContent='pulling...';requestAnimationFrame(loop);}});
window.addEventListener('resize',fit);
fit();
</script></body></html>
